syntax = "proto3";

package domain.ledger.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/ledger/charge_policy_version";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "domain/ledger/charge_policy_posting/charge_policy_posting.proto";
import "domain/ledger/charge_policy_component/charge_policy_component.proto";

import "domain/ledger/enums/enums.proto";
import "options/db.proto";

// ChargePolicyVersion is one immutable-once-approved version of a ChargePolicy. Only DRAFT
// versions (and their components/postings) can change; APPROVED versions are frozen and are
// superseded in the same transaction when a newer version is approved.
message ChargePolicyVersion {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "charge_policy_id,version_number";

  string id = 1;
  string workspace_id = 2 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string charge_policy_id = 3 [(options.v1.db).references = "charge_policy", (options.v1.db).index = true];
  int32 version_number = 4 [(options.v1.db).check = "version_number > 0"];  // UNIQUE (charge_policy_id, version_number) via unique_together
  // One DRAFT per policy: partial unique index uq_charge_policy_version_one_draft (WHERE status = DRAFT) in the migration; annotations cannot express the predicate.
  domain.ledger.v1.ChargePolicyVersionStatus status = 5 [(options.v1.db).check = "status IN ('CHARGE_POLICY_VERSION_STATUS_DRAFT', 'CHARGE_POLICY_VERSION_STATUS_APPROVED', 'CHARGE_POLICY_VERSION_STATUS_SUPERSEDED')"];
  optional domain.ledger.v1.AccountingRole accounting_role = 6 [(options.v1.db).check = "accounting_role IS NULL OR accounting_role IN ('ACCOUNTING_ROLE_PRINCIPAL', 'ACCOUNTING_ROLE_AGENT')"];
  optional domain.ledger.v1.BookPresentation book_presentation = 7 [(options.v1.db).check = "book_presentation IS NULL OR book_presentation IN ('BOOK_PRESENTATION_REVENUE', 'BOOK_PRESENTATION_EXCLUDED_REIMBURSEMENT')"];
  optional domain.ledger.v1.TaxPosition tax_position = 8 [(options.v1.db).check = "tax_position IS NULL OR tax_position IN ('TAX_POSITION_OWN_SUPPLY', 'TAX_POSITION_EXCLUDED_REIMBURSEMENT')"];
  optional string tax_treatment_id = 9 [(options.v1.db).references = "tax_treatment", (options.v1.db).index = true];
  optional string assessment_scope = 10;  // required non-blank at approval
  optional string assessment_note = 11;
  optional string cloned_from_version_id = 12 [(options.v1.db).references = "charge_policy_version", (options.v1.db).index = true];
  optional string prepared_by = 13;
  optional string approved_by = 14;
  optional int64 approved_at = 15;
  bool self_approved = 16 [(options.v1.db).default = "false"];  // audit flag: approver == preparer
  optional int64 superseded_at = 17;
  bool active = 18 [(options.v1.db).default = "true"];
  optional int64 date_created = 19;
  optional string date_created_string = 20 [(options.v1.db).ignore = true];
  optional int64 date_modified = 21;
  optional string date_modified_string = 22 [(options.v1.db).ignore = true];
}

service ChargePolicyVersionDomainService {
  rpc CreateChargePolicyVersion(CreateChargePolicyVersionRequest) returns (CreateChargePolicyVersionResponse);
  rpc ReadChargePolicyVersion(ReadChargePolicyVersionRequest) returns (ReadChargePolicyVersionResponse);
  rpc UpdateChargePolicyVersion(UpdateChargePolicyVersionRequest) returns (UpdateChargePolicyVersionResponse);
  rpc DeleteChargePolicyVersion(DeleteChargePolicyVersionRequest) returns (DeleteChargePolicyVersionResponse);
  rpc ListChargePolicyVersions(ListChargePolicyVersionsRequest) returns (ListChargePolicyVersionsResponse);
  rpc GetChargePolicyVersionListPageData(GetChargePolicyVersionListPageDataRequest) returns (GetChargePolicyVersionListPageDataResponse);
  rpc GetChargePolicyVersionItemPageData(GetChargePolicyVersionItemPageDataRequest) returns (GetChargePolicyVersionItemPageDataResponse);
  rpc CreateDraftChargePolicyVersion(CreateDraftChargePolicyVersionRequest) returns (CreateDraftChargePolicyVersionResponse);
  rpc ValidateChargePolicyVersionForApproval(ValidateChargePolicyVersionForApprovalRequest) returns (ValidateChargePolicyVersionForApprovalResponse);
  rpc ApproveChargePolicyVersion(ApproveChargePolicyVersionRequest) returns (ApproveChargePolicyVersionResponse);
}

message CreateChargePolicyVersionRequest {
  ChargePolicyVersion data = 1;
}

message CreateChargePolicyVersionResponse {
  repeated ChargePolicyVersion data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadChargePolicyVersionRequest {
  ChargePolicyVersion data = 1;
}

message ReadChargePolicyVersionResponse {
  repeated ChargePolicyVersion data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
  // Enrichment: the version's components and postings (data[0] is the version).
  repeated ChargePolicyComponent components = 4;
  repeated ChargePolicyPosting postings = 5;
}

message UpdateChargePolicyVersionRequest {
  ChargePolicyVersion data = 1;
}

message UpdateChargePolicyVersionResponse {
  repeated ChargePolicyVersion data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteChargePolicyVersionRequest {
  ChargePolicyVersion data = 1;
}

message DeleteChargePolicyVersionResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListChargePolicyVersionsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
  // Scope: only the versions of this policy.
  optional string charge_policy_id = 5;
}

message ListChargePolicyVersionsResponse {
  repeated ChargePolicyVersion data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
  optional domain.common.v1.PaginationResponse pagination = 4;
}

message GetChargePolicyVersionListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetChargePolicyVersionListPageDataResponse {
  repeated ChargePolicyVersion charge_policy_version_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetChargePolicyVersionItemPageDataRequest {
  string charge_policy_version_id = 1;
}

message GetChargePolicyVersionItemPageDataResponse {
  optional ChargePolicyVersion charge_policy_version = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// CreateDraftChargePolicyVersion clones the latest APPROVED version into a new DRAFT (components +
// postings copied, cloned_from_version_id set, number = max+1). Refused when a draft exists.
message CreateDraftChargePolicyVersionRequest {
  string charge_policy_id = 1;
}

message CreateDraftChargePolicyVersionResponse {
  optional ChargePolicyVersion draft = 1;
  repeated ChargePolicyComponent components = 2;
  repeated ChargePolicyPosting postings = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

// One line of the approval checklist.
message ChargePolicyChecklistItem {
  string code = 1;
  bool passed = 2;
  string detail = 3;
}

// The S1 approval checklist and matrix verdict. supported=false means the classification is
// outside the S1 matrix; reasons then names why. passed is true when every item passed.
message ChargePolicyApprovalChecklist {
  bool supported = 1;
  repeated string reasons = 2;
  repeated ChargePolicyChecklistItem items = 3;
  bool passed = 4;
}

// ValidateChargePolicyVersionForApproval reads only; approval re-runs the same validation in its transaction.
message ValidateChargePolicyVersionForApprovalRequest {
  string charge_policy_version_id = 1;
}

message ValidateChargePolicyVersionForApprovalResponse {
  optional ChargePolicyApprovalChecklist checklist = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// ApproveChargePolicyVersion approves a DRAFT and supersedes the previous APPROVED version in one
// transaction. Refusals return a coded error (ErrorCode()); a failed checklist is carried by the error.
message ApproveChargePolicyVersionRequest {
  string charge_policy_version_id = 1;
}

message ApproveChargePolicyVersionResponse {
  optional ChargePolicyVersion data = 1;
  // The previously APPROVED version, when any.
  optional ChargePolicyVersion superseded = 2;
  optional ChargePolicyApprovalChecklist checklist = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}
