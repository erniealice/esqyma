syntax = "proto3";

package domain.ledger.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/ledger/charge_policy_posting";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/ledger/enums/enums.proto";
import "options/db.proto";

// ChargePolicyPosting maps a (event, posting_role) pair of a policy version to a ledger
// account. UNIQUE (charge_policy_version_id, event, posting_role) is authored in the migration.
message ChargePolicyPosting {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "charge_policy_version_id,event,posting_role";

  string id = 1;
  string workspace_id = 2 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string charge_policy_version_id = 3 [(options.v1.db).references = "charge_policy_version", (options.v1.db).index = true];
  domain.ledger.v1.ChargePostingEvent event = 4 [(options.v1.db).check = "event IN ('CHARGE_POSTING_EVENT_ALLOCATION', 'CHARGE_POSTING_EVENT_ISSUE', 'CHARGE_POSTING_EVENT_APPLICATION', 'CHARGE_POSTING_EVENT_REVERSAL')"];
  domain.ledger.v1.ChargePostingRole posting_role = 5 [(options.v1.db).check = "posting_role IN ('CHARGE_POSTING_ROLE_RECEIVABLE', 'CHARGE_POSTING_ROLE_CLEARING', 'CHARGE_POSTING_ROLE_REVENUE', 'CHARGE_POSTING_ROLE_REFUND_LIABILITY', 'CHARGE_POSTING_ROLE_EXPENSE', 'CHARGE_POSTING_ROLE_CASH')"];
  string account_id = 6 [(options.v1.db).references = "account", (options.v1.db).index = true];
  bool active = 7 [(options.v1.db).default = "true"];
  optional int64 date_created = 8;
  optional string date_created_string = 9 [(options.v1.db).ignore = true];
  optional int64 date_modified = 10;
  optional string date_modified_string = 11 [(options.v1.db).ignore = true];
}

service ChargePolicyPostingDomainService {
  rpc CreateChargePolicyPosting(CreateChargePolicyPostingRequest) returns (CreateChargePolicyPostingResponse);
  rpc ReadChargePolicyPosting(ReadChargePolicyPostingRequest) returns (ReadChargePolicyPostingResponse);
  rpc UpdateChargePolicyPosting(UpdateChargePolicyPostingRequest) returns (UpdateChargePolicyPostingResponse);
  rpc DeleteChargePolicyPosting(DeleteChargePolicyPostingRequest) returns (DeleteChargePolicyPostingResponse);
  rpc ListChargePolicyPostings(ListChargePolicyPostingsRequest) returns (ListChargePolicyPostingsResponse);
  rpc GetChargePolicyPostingListPageData(GetChargePolicyPostingListPageDataRequest) returns (GetChargePolicyPostingListPageDataResponse);
  rpc GetChargePolicyPostingItemPageData(GetChargePolicyPostingItemPageDataRequest) returns (GetChargePolicyPostingItemPageDataResponse);
}

message CreateChargePolicyPostingRequest {
  ChargePolicyPosting data = 1;
}

message CreateChargePolicyPostingResponse {
  repeated ChargePolicyPosting data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadChargePolicyPostingRequest {
  ChargePolicyPosting data = 1;
}

message ReadChargePolicyPostingResponse {
  repeated ChargePolicyPosting data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateChargePolicyPostingRequest {
  ChargePolicyPosting data = 1;
}

message UpdateChargePolicyPostingResponse {
  repeated ChargePolicyPosting data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteChargePolicyPostingRequest {
  ChargePolicyPosting data = 1;
}

message DeleteChargePolicyPostingResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListChargePolicyPostingsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
  // Scope: only the rows of this version.
  optional string charge_policy_version_id = 5;
}

message ListChargePolicyPostingsResponse {
  repeated ChargePolicyPosting data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
  optional domain.common.v1.PaginationResponse pagination = 4;
}

message GetChargePolicyPostingListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetChargePolicyPostingListPageDataResponse {
  repeated ChargePolicyPosting charge_policy_posting_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetChargePolicyPostingItemPageDataRequest {
  string charge_policy_posting_id = 1;
}

message GetChargePolicyPostingItemPageDataResponse {
  optional ChargePolicyPosting charge_policy_posting = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
