syntax = "proto3";

package domain.ledger.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/ledger/charge_policy_version_editor";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "options/db.proto";

// ChargePolicyVersionEditor records every user who edited a DRAFT charge policy version (SoD): the
// approver counts as "self" when they are the preparer or any recorded editor. One row per
// (version, user); first_edited_at is stamped on the first edit and never restamped.
message ChargePolicyVersionEditor {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "charge_policy_version_id,user_id";

  string id = 1;
  string workspace_id = 2 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string charge_policy_version_id = 3 [(options.v1.db).references = "charge_policy_version", (options.v1.db).index = true];
  string user_id = 4 [(options.v1.db).check = "btrim(user_id) <> ''"];
  optional int64 first_edited_at = 5;
  bool active = 6 [(options.v1.db).default = "true"];
  optional int64 date_created = 7;
  optional string date_created_string = 8 [(options.v1.db).ignore = true];
  optional int64 date_modified = 9;
  optional string date_modified_string = 10 [(options.v1.db).ignore = true];
}

service ChargePolicyVersionEditorDomainService {
  rpc CreateChargePolicyVersionEditor(CreateChargePolicyVersionEditorRequest) returns (CreateChargePolicyVersionEditorResponse);
  rpc ReadChargePolicyVersionEditor(ReadChargePolicyVersionEditorRequest) returns (ReadChargePolicyVersionEditorResponse);
  rpc UpdateChargePolicyVersionEditor(UpdateChargePolicyVersionEditorRequest) returns (UpdateChargePolicyVersionEditorResponse);
  rpc DeleteChargePolicyVersionEditor(DeleteChargePolicyVersionEditorRequest) returns (DeleteChargePolicyVersionEditorResponse);
  rpc ListChargePolicyVersionEditors(ListChargePolicyVersionEditorsRequest) returns (ListChargePolicyVersionEditorsResponse);
  rpc GetChargePolicyVersionEditorListPageData(GetChargePolicyVersionEditorListPageDataRequest) returns (GetChargePolicyVersionEditorListPageDataResponse);
  rpc GetChargePolicyVersionEditorItemPageData(GetChargePolicyVersionEditorItemPageDataRequest) returns (GetChargePolicyVersionEditorItemPageDataResponse);
}

message CreateChargePolicyVersionEditorRequest {
  ChargePolicyVersionEditor data = 1;
}

message CreateChargePolicyVersionEditorResponse {
  repeated ChargePolicyVersionEditor data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadChargePolicyVersionEditorRequest {
  ChargePolicyVersionEditor data = 1;
}

message ReadChargePolicyVersionEditorResponse {
  repeated ChargePolicyVersionEditor data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateChargePolicyVersionEditorRequest {
  ChargePolicyVersionEditor data = 1;
}

message UpdateChargePolicyVersionEditorResponse {
  repeated ChargePolicyVersionEditor data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteChargePolicyVersionEditorRequest {
  ChargePolicyVersionEditor data = 1;
}

message DeleteChargePolicyVersionEditorResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListChargePolicyVersionEditorsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
  // Scope: only the editors of this version (SoD lookup).
  optional string charge_policy_version_id = 5;
}

message ListChargePolicyVersionEditorsResponse {
  repeated ChargePolicyVersionEditor data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
  optional domain.common.v1.PaginationResponse pagination = 4;
}

message GetChargePolicyVersionEditorListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetChargePolicyVersionEditorListPageDataResponse {
  repeated ChargePolicyVersionEditor charge_policy_version_editor_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetChargePolicyVersionEditorItemPageDataRequest {
  string charge_policy_version_editor_id = 1;
}

message GetChargePolicyVersionEditorItemPageDataResponse {
  optional ChargePolicyVersionEditor charge_policy_version_editor = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
