syntax = "proto3";

package domain.subscription.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/subscription/subscription_group_product_plan_staff";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// SubscriptionGroupProductPlanStaff is the CLASS EDGE — the per-section
// deliverer of record: (subscription_group x product_plan x staff x role). It
// is the scalable per-section sibling of the per-student subscription_seat, and
// doubles as the grade-sheet scope (rows = members, cols = the subject's tasks x
// criteria). Because subscription_group is year-scoped (via price_schedule_id),
// the class edge is already per-year — the catalog is never duplicated.
// Self-validates at the use-case layer: product_plan.plan_id ==
// subscription_group.plan_id, with an active product_plan_staff eligibility.
message SubscriptionGroupProductPlanStaff {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "subscription_group_id,product_plan_id,staff_id";
  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string workspace_id = 7 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string subscription_group_id = 8 [(options.v1.db).references = "subscription_group", (options.v1.db).index = true];
  string product_plan_id = 9 [(options.v1.db).references = "product_plan", (options.v1.db).index = true];
  string staff_id = 10 [(options.v1.db).references = "staff", (options.v1.db).index = true];
  string role = 11;
}

service SubscriptionGroupProductPlanStaffDomainService {
  rpc CreateSubscriptionGroupProductPlanStaff(CreateSubscriptionGroupProductPlanStaffRequest) returns (CreateSubscriptionGroupProductPlanStaffResponse);
  rpc ReadSubscriptionGroupProductPlanStaff(ReadSubscriptionGroupProductPlanStaffRequest) returns (ReadSubscriptionGroupProductPlanStaffResponse);
  rpc UpdateSubscriptionGroupProductPlanStaff(UpdateSubscriptionGroupProductPlanStaffRequest) returns (UpdateSubscriptionGroupProductPlanStaffResponse);
  rpc DeleteSubscriptionGroupProductPlanStaff(DeleteSubscriptionGroupProductPlanStaffRequest) returns (DeleteSubscriptionGroupProductPlanStaffResponse);
  rpc ListSubscriptionGroupProductPlanStaffs(ListSubscriptionGroupProductPlanStaffsRequest) returns (ListSubscriptionGroupProductPlanStaffsResponse);

  rpc GetSubscriptionGroupProductPlanStaffListPageData(GetSubscriptionGroupProductPlanStaffListPageDataRequest)
    returns (GetSubscriptionGroupProductPlanStaffListPageDataResponse);
  rpc GetSubscriptionGroupProductPlanStaffItemPageData(GetSubscriptionGroupProductPlanStaffItemPageDataRequest)
    returns (GetSubscriptionGroupProductPlanStaffItemPageDataResponse);
}

message CreateSubscriptionGroupProductPlanStaffRequest {
  SubscriptionGroupProductPlanStaff data = 1;
}

message CreateSubscriptionGroupProductPlanStaffResponse {
  repeated SubscriptionGroupProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadSubscriptionGroupProductPlanStaffRequest {
  SubscriptionGroupProductPlanStaff data = 1;
}

message ReadSubscriptionGroupProductPlanStaffResponse {
  repeated SubscriptionGroupProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateSubscriptionGroupProductPlanStaffRequest {
  SubscriptionGroupProductPlanStaff data = 1;
}

message UpdateSubscriptionGroupProductPlanStaffResponse {
  repeated SubscriptionGroupProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteSubscriptionGroupProductPlanStaffRequest {
  SubscriptionGroupProductPlanStaff data = 1;
}

message DeleteSubscriptionGroupProductPlanStaffResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListSubscriptionGroupProductPlanStaffsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListSubscriptionGroupProductPlanStaffsResponse {
  repeated SubscriptionGroupProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetSubscriptionGroupProductPlanStaffListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetSubscriptionGroupProductPlanStaffListPageDataResponse {
  repeated SubscriptionGroupProductPlanStaff subscription_group_product_plan_staff_list = 1;
  domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetSubscriptionGroupProductPlanStaffItemPageDataRequest {
  string subscription_group_product_plan_staff_id = 1;
}

message GetSubscriptionGroupProductPlanStaffItemPageDataResponse {
  SubscriptionGroupProductPlanStaff subscription_group_product_plan_staff = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
