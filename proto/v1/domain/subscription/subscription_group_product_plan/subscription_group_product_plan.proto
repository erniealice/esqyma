syntax = "proto3";

package domain.subscription.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/subscription/subscription_group_product_plan";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// Status of a SubscriptionGroupProductPlan row within its section's roster.
//   UNSPECIFIED — zero value, never a written state.
//   ACTIVE      — the offering is live on the section (default creation state).
//   EXCLUDED    — soft-excluded from the roster surface (absorbs the legacy
//                 I-4 exclude); guarded when the class has live courses or
//                 live assignments (see plan.md §2).
enum SubscriptionGroupProductPlanStatus {
  SUBSCRIPTION_GROUP_PRODUCT_PLAN_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_GROUP_PRODUCT_PLAN_STATUS_ACTIVE       = 1;
  SUBSCRIPTION_GROUP_PRODUCT_PLAN_STATUS_EXCLUDED     = 2;
}

// SubscriptionGroupProductPlan is THE CLASS — a per-section, per-offering
// delivery instance: (subscription_group x product_plan), anchored to the
// job_template that names its curriculum (and, through it, its phases). It
// sits ABOVE the assignment edge (SubscriptionGroupProductPlanStaff), which
// re-parents onto it as (class x eligibility [x phase]). A class row may
// exist unstaffed — "no staff yet" is a legal state. Lives in the
// subscription domain (a per-group delivery instance of a catalog line, not
// a catalog concern) as the sibling of its staff edge. See
// docs/plan/20260724-section-assignment-merged/plan.md §1.1/§1.1b.
message SubscriptionGroupProductPlan {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "subscription_group_id,product_plan_id";
  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string workspace_id = 7 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string subscription_group_id = 8 [(options.v1.db).references = "subscription_group", (options.v1.db).index = true];
  string product_plan_id = 9 [(options.v1.db).references = "product_plan", (options.v1.db).index = true];
  string job_template_id = 10 [(options.v1.db).references = "job_template", (options.v1.db).index = true]; // curriculum anchor
  SubscriptionGroupProductPlanStatus status = 11; // UNSPECIFIED=0 · ACTIVE=1 · EXCLUDED=2
}

service SubscriptionGroupProductPlanDomainService {
  rpc CreateSubscriptionGroupProductPlan(CreateSubscriptionGroupProductPlanRequest) returns (CreateSubscriptionGroupProductPlanResponse);
  rpc ReadSubscriptionGroupProductPlan(ReadSubscriptionGroupProductPlanRequest) returns (ReadSubscriptionGroupProductPlanResponse);
  rpc UpdateSubscriptionGroupProductPlan(UpdateSubscriptionGroupProductPlanRequest) returns (UpdateSubscriptionGroupProductPlanResponse);
  rpc DeleteSubscriptionGroupProductPlan(DeleteSubscriptionGroupProductPlanRequest) returns (DeleteSubscriptionGroupProductPlanResponse);
  rpc ListSubscriptionGroupProductPlans(ListSubscriptionGroupProductPlansRequest) returns (ListSubscriptionGroupProductPlansResponse);

  rpc GetSubscriptionGroupProductPlanListPageData(GetSubscriptionGroupProductPlanListPageDataRequest)
    returns (GetSubscriptionGroupProductPlanListPageDataResponse);
  rpc GetSubscriptionGroupProductPlanItemPageData(GetSubscriptionGroupProductPlanItemPageDataRequest)
    returns (GetSubscriptionGroupProductPlanItemPageDataResponse);
}

message CreateSubscriptionGroupProductPlanRequest {
  SubscriptionGroupProductPlan data = 1;
}

message CreateSubscriptionGroupProductPlanResponse {
  repeated SubscriptionGroupProductPlan data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadSubscriptionGroupProductPlanRequest {
  SubscriptionGroupProductPlan data = 1;
}

message ReadSubscriptionGroupProductPlanResponse {
  repeated SubscriptionGroupProductPlan data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateSubscriptionGroupProductPlanRequest {
  SubscriptionGroupProductPlan data = 1;
}

message UpdateSubscriptionGroupProductPlanResponse {
  repeated SubscriptionGroupProductPlan data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteSubscriptionGroupProductPlanRequest {
  SubscriptionGroupProductPlan data = 1;
}

message DeleteSubscriptionGroupProductPlanResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListSubscriptionGroupProductPlansRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListSubscriptionGroupProductPlansResponse {
  repeated SubscriptionGroupProductPlan data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetSubscriptionGroupProductPlanListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetSubscriptionGroupProductPlanListPageDataResponse {
  repeated SubscriptionGroupProductPlan subscription_group_product_plan_list = 1;
  domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetSubscriptionGroupProductPlanItemPageDataRequest {
  string subscription_group_product_plan_id = 1;
}

message GetSubscriptionGroupProductPlanItemPageDataResponse {
  SubscriptionGroupProductPlan subscription_group_product_plan = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
