syntax = "proto3";

package domain.subscription.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/subscription/subscription_group_workspace_user";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// SubscriptionGroupWorkspaceUser pins an operator (workspace_user) at a
// subscription_group (cohort) node for group-level servicing/visibility.
// Shape mirrors line_workspace_user (workspace_id + is_owner); the parent FK is
// subscription_group_id instead of line_id, plus a generic servicing-capacity
// axis (see the capacity field). Vertical titles render from lyngua, never
// stored here.
message SubscriptionGroupWorkspaceUser {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "subscription_group_id,workspace_user_id";
  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string workspace_id = 7 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string subscription_group_id = 8 [(options.v1.db).references = "subscription_group", (options.v1.db).index = true];
  string workspace_user_id = 9 [(options.v1.db).references = "workspace_user", (options.v1.db).index = true];
  reserved 10, 11;                 // former scope(10), role(11) — removed 2026-07 (servicing-grant refactor)
  reserved "scope", "role";        // NAMES reserved: the storage bridge is name-based protojson; a future
                                   // field reusing these names would silently absorb stale column values.
  bool is_owner = 12 [(options.v1.db).default = "false"];   // unchanged — do NOT renumber
  // Generic servicing-capacity axis (replaces the removed discriminator's info content). NOT a vertical title.
  //   'primary' = servicer / lead-eligible;  'access' = view-only member.
  // Vertical titles render from lyngua on (node type, capacity, is_owner).
  string capacity = 13 [(options.v1.db).default = "access", (options.v1.db).check = "capacity IN ('primary','access')"];
}

service SubscriptionGroupWorkspaceUserDomainService {
  rpc CreateSubscriptionGroupWorkspaceUser(CreateSubscriptionGroupWorkspaceUserRequest) returns (CreateSubscriptionGroupWorkspaceUserResponse);
  rpc ReadSubscriptionGroupWorkspaceUser(ReadSubscriptionGroupWorkspaceUserRequest) returns (ReadSubscriptionGroupWorkspaceUserResponse);
  rpc UpdateSubscriptionGroupWorkspaceUser(UpdateSubscriptionGroupWorkspaceUserRequest) returns (UpdateSubscriptionGroupWorkspaceUserResponse);
  rpc DeleteSubscriptionGroupWorkspaceUser(DeleteSubscriptionGroupWorkspaceUserRequest) returns (DeleteSubscriptionGroupWorkspaceUserResponse);
  rpc ListSubscriptionGroupWorkspaceUsers(ListSubscriptionGroupWorkspaceUsersRequest) returns (ListSubscriptionGroupWorkspaceUsersResponse);

  // Enhanced list with pagination, filtering, sorting, search
  rpc GetSubscriptionGroupWorkspaceUserListPageData(GetSubscriptionGroupWorkspaceUserListPageDataRequest)
    returns (GetSubscriptionGroupWorkspaceUserListPageDataResponse);

  // Enhanced item view with related data
  rpc GetSubscriptionGroupWorkspaceUserItemPageData(GetSubscriptionGroupWorkspaceUserItemPageDataRequest)
    returns (GetSubscriptionGroupWorkspaceUserItemPageDataResponse);
}

message CreateSubscriptionGroupWorkspaceUserRequest {
  SubscriptionGroupWorkspaceUser data = 1;
}

message CreateSubscriptionGroupWorkspaceUserResponse {
  repeated SubscriptionGroupWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadSubscriptionGroupWorkspaceUserRequest {
  SubscriptionGroupWorkspaceUser data = 1;
}

message ReadSubscriptionGroupWorkspaceUserResponse {
  repeated SubscriptionGroupWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateSubscriptionGroupWorkspaceUserRequest {
  SubscriptionGroupWorkspaceUser data = 1;
}

message UpdateSubscriptionGroupWorkspaceUserResponse {
  repeated SubscriptionGroupWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteSubscriptionGroupWorkspaceUserRequest {
  SubscriptionGroupWorkspaceUser data = 1;
}

message DeleteSubscriptionGroupWorkspaceUserResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListSubscriptionGroupWorkspaceUsersRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListSubscriptionGroupWorkspaceUsersResponse {
  repeated SubscriptionGroupWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetSubscriptionGroupWorkspaceUserListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetSubscriptionGroupWorkspaceUserListPageDataResponse {
  repeated SubscriptionGroupWorkspaceUser subscription_group_workspace_user_list = 1;
  domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetSubscriptionGroupWorkspaceUserItemPageDataRequest {
  string subscription_group_workspace_user_id = 1;
}

message GetSubscriptionGroupWorkspaceUserItemPageDataResponse {
  SubscriptionGroupWorkspaceUser subscription_group_workspace_user = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
