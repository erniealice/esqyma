syntax = "proto3";

package domain.common.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/common";

import "domain/common/error.proto";
import "domain/common/filter.proto";
import "domain/common/pagination.proto";
import "options/db.proto";

message Attribute {
  option (options.v1.table).table = true;
  string id = 1;
  string name = 2;
  string description = 3;
  string code = 4;
  string data_type = 5;
  string module = 6;
  optional int64 date_created = 7;
  optional string date_created_string = 8 [(options.v1.db).ignore = true];
  optional int64 date_modified = 9;
  optional string date_modified_string = 10 [(options.v1.db).ignore = true];
  bool active = 11 [(options.v1.db).default = "true"];

  // --- Typed constraint columns (Q-GSE-10, D1 archaeology lock, additive) -----
  // These give the generic EAV `Attribute` the same typed-bounds vocabulary that
  // the retail-born, proven `ProductOption` already carries (min_value/max_value/
  // required + a data_type dispatch). They fan out across ALL 13 `*_attribute`
  // consumers that FK this ONE message: client / supplier / staff / delegate /
  // group / location / plan / subscription / balance / invoice / event /
  // collection / product _attribute. Additive + nullable — a NULL means "no
  // constraint" (today's behaviour for every existing row).
  //
  // `data_type` (field 5) is repointed to carry the ProductOption input-dispatch
  // vocabulary — text_list / number_list / color_list / free_text / free_number /
  // option / … (see docs/plan/20260716-grade-sheet-edit-mode/research/D1-
  // attribute-value-archaeology.md §2). It was a dead field (every seeded value
  // the literal "option", zero code branched on it); the real use-case validator
  // that reads these columns ships in the same wave (D1 rider 1).
  optional double min_value = 12;   // numeric lower bound (free_number). NULL = unbounded.
  optional double max_value = 13;   // numeric upper bound (free_number). NULL = unbounded.
  optional int32 min_length = 14;   // text min length (free_text). NULL = no minimum.
  optional int32 max_length = 15;   // text max length (free_text). NULL = no maximum.
  optional bool required = 16;      // value required when the attribute is presented. NULL = optional.
}

// AttributeCodeValue represents an attribute by its code and value.
// Used for code-based attribute creation where the code is resolved to an ID internally.
message AttributeCodeValue {
  string code = 1;
  string value = 2;
}

service AttributeDomainService {
  rpc CreateAttribute(CreateAttributeRequest) returns (CreateAttributeResponse);
  rpc ReadAttribute(ReadAttributeRequest) returns (ReadAttributeResponse);
  rpc UpdateAttribute(UpdateAttributeRequest) returns (UpdateAttributeResponse);
  rpc DeleteAttribute(DeleteAttributeRequest) returns (DeleteAttributeResponse);
  rpc ListAttributes(ListAttributesRequest) returns (ListAttributesResponse);
}

message CreateAttributeRequest {
  Attribute data = 1;
}

message CreateAttributeResponse {
  repeated Attribute data = 1;
  bool success = 2;
  optional Error error = 3;
}

message ReadAttributeRequest {
  Attribute data = 1;
}

message ReadAttributeResponse {
  repeated Attribute data = 1;
  bool success = 2;
  optional Error error = 3;
}

message UpdateAttributeRequest {
  Attribute data = 1;
}

message UpdateAttributeResponse {
  repeated Attribute data = 1;
  bool success = 2;
  optional Error error = 3;
}

message DeleteAttributeRequest {
  Attribute data = 1;
}

message DeleteAttributeResponse {
  repeated Attribute data = 1;
  bool success = 2;
  optional Error error = 3;
}

message ListAttributesRequest {
  optional FilterRequest filters = 1;
  optional PaginationRequest pagination = 2;
}

message ListAttributesResponse {
  repeated Attribute data = 1;
  bool success = 2;
  optional Error error = 3;
}
