syntax = "proto3";

package domain.revenue.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/revenue/recovery_document_line";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "options/db.proto";

// One line of a recovery document; a charge component appears on at most one line.
message RecoveryDocumentLine {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "charge_component_id";

  string id = 1;
  string workspace_id = 2 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string recovery_document_id = 3 [(options.v1.db).references = "recovery_document", (options.v1.db).index = true];
  string charge_component_id = 4 [(options.v1.db).references = "charge_component"];
  optional string description = 5;
  int64 amount = 6 [(options.v1.db).default = "0"];
  string currency = 7;
  optional string service_from = 8;
  optional string service_to = 9;
  bool active = 10 [(options.v1.db).default = "true"];
  optional int64 date_created = 11;
  optional string date_created_string = 12 [(options.v1.db).ignore = true];
  optional int64 date_modified = 13;
  optional string date_modified_string = 14 [(options.v1.db).ignore = true];
}

service RecoveryDocumentLineDomainService {
  rpc CreateRecoveryDocumentLine(CreateRecoveryDocumentLineRequest) returns (CreateRecoveryDocumentLineResponse);
  rpc ReadRecoveryDocumentLine(ReadRecoveryDocumentLineRequest) returns (ReadRecoveryDocumentLineResponse);
  rpc UpdateRecoveryDocumentLine(UpdateRecoveryDocumentLineRequest) returns (UpdateRecoveryDocumentLineResponse);
  rpc DeleteRecoveryDocumentLine(DeleteRecoveryDocumentLineRequest) returns (DeleteRecoveryDocumentLineResponse);
  rpc ListRecoveryDocumentLines(ListRecoveryDocumentLinesRequest) returns (ListRecoveryDocumentLinesResponse);
  rpc GetRecoveryDocumentLineListPageData(GetRecoveryDocumentLineListPageDataRequest) returns (GetRecoveryDocumentLineListPageDataResponse);
  rpc GetRecoveryDocumentLineItemPageData(GetRecoveryDocumentLineItemPageDataRequest) returns (GetRecoveryDocumentLineItemPageDataResponse);
}

message CreateRecoveryDocumentLineRequest {
  RecoveryDocumentLine data = 1;
}

message CreateRecoveryDocumentLineResponse {
  repeated RecoveryDocumentLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadRecoveryDocumentLineRequest {
  RecoveryDocumentLine data = 1;
}

message ReadRecoveryDocumentLineResponse {
  repeated RecoveryDocumentLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateRecoveryDocumentLineRequest {
  RecoveryDocumentLine data = 1;
}

message UpdateRecoveryDocumentLineResponse {
  repeated RecoveryDocumentLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteRecoveryDocumentLineRequest {
  RecoveryDocumentLine data = 1;
}

message DeleteRecoveryDocumentLineResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListRecoveryDocumentLinesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListRecoveryDocumentLinesResponse {
  repeated RecoveryDocumentLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetRecoveryDocumentLineListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetRecoveryDocumentLineListPageDataResponse {
  repeated RecoveryDocumentLine recovery_document_line_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetRecoveryDocumentLineItemPageDataRequest {
  string recovery_document_line_id = 1;
}

message GetRecoveryDocumentLineItemPageDataResponse {
  optional RecoveryDocumentLine recovery_document_line = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
