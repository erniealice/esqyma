syntax = "proto3";

package domain.expenditure.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/expenditure/allocation_share";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "options/db.proto";

enum AllocationShareKind {
  ALLOCATION_SHARE_KIND_UNSPECIFIED = 0;
  ALLOCATION_SHARE_KIND_RECOVERABLE = 1;
  ALLOCATION_SHARE_KIND_OWN_USE = 2;
  ALLOCATION_SHARE_KIND_VACANCY = 3;
  ALLOCATION_SHARE_KIND_COMMON_LOSS = 4;
}

// One participant's share of an allocation batch. RECOVERABLE shares name the subscription and client; OWN_USE/VACANCY/COMMON_LOSS produce no charge.
message AllocationShare {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "allocation_batch_id,sequence_order";

  string id = 1;
  string workspace_id = 2 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string allocation_batch_id = 3 [(options.v1.db).references = "allocation_batch", (options.v1.db).index = true];
  domain.expenditure.v1.AllocationShareKind share_kind = 4 [(options.v1.db).check = "(share_kind IN ('ALLOCATION_SHARE_KIND_RECOVERABLE', 'ALLOCATION_SHARE_KIND_OWN_USE', 'ALLOCATION_SHARE_KIND_VACANCY', 'ALLOCATION_SHARE_KIND_COMMON_LOSS')) AND (share_kind <> 'ALLOCATION_SHARE_KIND_RECOVERABLE' OR (subscription_id IS NOT NULL AND client_id IS NOT NULL))"];
  optional string subscription_id = 5 [(options.v1.db).references = "subscription", (options.v1.db).index = true];
  optional string client_id = 6 [(options.v1.db).references = "client", (options.v1.db).index = true];
  int64 basis_numerator = 7 [(options.v1.db).check = "basis_numerator >= 0", (options.v1.db).default = "0"];
  int64 basis_denominator = 8 [(options.v1.db).check = "basis_denominator > 0"];
  int64 amount = 9 [(options.v1.db).default = "0"];
  int32 sequence_order = 10 [(options.v1.db).default = "0"];
  bool active = 11 [(options.v1.db).default = "true"];
  optional int64 date_created = 12;
  optional string date_created_string = 13 [(options.v1.db).ignore = true];
  optional int64 date_modified = 14;
  optional string date_modified_string = 15 [(options.v1.db).ignore = true];
}

service AllocationShareDomainService {
  rpc CreateAllocationShare(CreateAllocationShareRequest) returns (CreateAllocationShareResponse);
  rpc ReadAllocationShare(ReadAllocationShareRequest) returns (ReadAllocationShareResponse);
  rpc UpdateAllocationShare(UpdateAllocationShareRequest) returns (UpdateAllocationShareResponse);
  rpc DeleteAllocationShare(DeleteAllocationShareRequest) returns (DeleteAllocationShareResponse);
  rpc ListAllocationShares(ListAllocationSharesRequest) returns (ListAllocationSharesResponse);
  rpc GetAllocationShareListPageData(GetAllocationShareListPageDataRequest) returns (GetAllocationShareListPageDataResponse);
  rpc GetAllocationShareItemPageData(GetAllocationShareItemPageDataRequest) returns (GetAllocationShareItemPageDataResponse);
}

message CreateAllocationShareRequest {
  AllocationShare data = 1;
}

message CreateAllocationShareResponse {
  repeated AllocationShare data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadAllocationShareRequest {
  AllocationShare data = 1;
}

message ReadAllocationShareResponse {
  repeated AllocationShare data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateAllocationShareRequest {
  AllocationShare data = 1;
}

message UpdateAllocationShareResponse {
  repeated AllocationShare data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteAllocationShareRequest {
  AllocationShare data = 1;
}

message DeleteAllocationShareResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListAllocationSharesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListAllocationSharesResponse {
  repeated AllocationShare data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetAllocationShareListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetAllocationShareListPageDataResponse {
  repeated AllocationShare allocation_share_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetAllocationShareItemPageDataRequest {
  string allocation_share_id = 1;
}

message GetAllocationShareItemPageDataResponse {
  optional AllocationShare allocation_share = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
