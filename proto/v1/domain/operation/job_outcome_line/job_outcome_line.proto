syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/job_outcome_line";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/enums/enums.proto";
import "options/db.proto";

// --- Message ---

message JobOutcomeLine {
  option (options.v1.table).table = true;

  string id = 1;
  string job_outcome_summary_id = 2 [(options.v1.db).references = "job_outcome_summary", (options.v1.db).index = true];
  string label = 3;
  optional double weight_or_credits = 4;
  optional double output_value = 5;
  optional string output_label = 6;
  optional string score_scale_band_id = 7 [(options.v1.db).references = "score_scale_band", (options.v1.db).index = true];
  domain.operation.v1.ReportingRole reporting_role = 8;
  bool active = 9 [(options.v1.db).default = "true"];
  optional int64 date_created = 10;
  optional string date_created_string = 11 [(options.v1.db).ignore = true];
  optional int64 date_modified = 12;
  optional string date_modified_string = 13 [(options.v1.db).ignore = true];
}

// --- Service ---

service JobOutcomeLineDomainService {
  rpc CreateJobOutcomeLine(CreateJobOutcomeLineRequest) returns (CreateJobOutcomeLineResponse);
  rpc ReadJobOutcomeLine(ReadJobOutcomeLineRequest) returns (ReadJobOutcomeLineResponse);
  rpc UpdateJobOutcomeLine(UpdateJobOutcomeLineRequest) returns (UpdateJobOutcomeLineResponse);
  rpc DeleteJobOutcomeLine(DeleteJobOutcomeLineRequest) returns (DeleteJobOutcomeLineResponse);
  rpc ListJobOutcomeLines(ListJobOutcomeLinesRequest) returns (ListJobOutcomeLinesResponse);
  rpc GetJobOutcomeLineListPageData(GetJobOutcomeLineListPageDataRequest) returns (GetJobOutcomeLineListPageDataResponse);
  rpc GetJobOutcomeLineItemPageData(GetJobOutcomeLineItemPageDataRequest) returns (GetJobOutcomeLineItemPageDataResponse);
}

// --- Standard CRUD messages ---

message CreateJobOutcomeLineRequest {
  JobOutcomeLine data = 1;
}

message CreateJobOutcomeLineResponse {
  repeated JobOutcomeLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadJobOutcomeLineRequest {
  JobOutcomeLine data = 1;
}

message ReadJobOutcomeLineResponse {
  repeated JobOutcomeLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateJobOutcomeLineRequest {
  JobOutcomeLine data = 1;
}

message UpdateJobOutcomeLineResponse {
  repeated JobOutcomeLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteJobOutcomeLineRequest {
  JobOutcomeLine data = 1;
}

message DeleteJobOutcomeLineResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListJobOutcomeLinesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListJobOutcomeLinesResponse {
  repeated JobOutcomeLine data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// --- PageData messages ---

message GetJobOutcomeLineListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetJobOutcomeLineListPageDataResponse {
  repeated JobOutcomeLine job_outcome_line_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetJobOutcomeLineItemPageDataRequest {
  string job_outcome_line_id = 1;
}

message GetJobOutcomeLineItemPageDataResponse {
  optional JobOutcomeLine job_outcome_line = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
