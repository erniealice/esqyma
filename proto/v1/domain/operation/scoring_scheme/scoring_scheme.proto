syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/scoring_scheme";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/enums/enums.proto";
import "options/db.proto";

message ScoringScheme {
  option (options.v1.table).table = true;

  string id = 1;
  optional string workspace_id = 2 [(options.v1.db).references = "workspace"];
  bool active = 3 [(options.v1.db).default = "true"];
  optional int64 date_created = 4;
  optional string date_created_string = 5 [(options.v1.db).ignore = true];
  optional int64 date_modified = 6;
  optional string date_modified_string = 7 [(options.v1.db).ignore = true];

  string scheme_group_id = 8;
  int32 version = 9;
  domain.operation.v1.VersionStatus version_status = 10;
  string name = 11;
  domain.operation.v1.ScoringMethod composite_method = 12;
  optional string score_scale_id = 13 [(options.v1.db).references = "score_scale", (options.v1.db).index = true];
  bool weights_must_sum_to_one = 14 [(options.v1.db).default = "false"];
  optional domain.operation.v1.RoundingMode rounding_mode = 15;
}

service ScoringSchemeDomainService {
  rpc CreateScoringScheme(CreateScoringSchemeRequest) returns (CreateScoringSchemeResponse);
  rpc ReadScoringScheme(ReadScoringSchemeRequest) returns (ReadScoringSchemeResponse);
  rpc UpdateScoringScheme(UpdateScoringSchemeRequest) returns (UpdateScoringSchemeResponse);
  rpc DeleteScoringScheme(DeleteScoringSchemeRequest) returns (DeleteScoringSchemeResponse);
  rpc ListScoringSchemes(ListScoringSchemesRequest) returns (ListScoringSchemesResponse);
  rpc GetScoringSchemeListPageData(GetScoringSchemeListPageDataRequest) returns (GetScoringSchemeListPageDataResponse);
  rpc GetScoringSchemeItemPageData(GetScoringSchemeItemPageDataRequest) returns (GetScoringSchemeItemPageDataResponse);
}

message CreateScoringSchemeRequest {
  ScoringScheme data = 1;
}

message CreateScoringSchemeResponse {
  repeated ScoringScheme data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadScoringSchemeRequest {
  ScoringScheme data = 1;
}

message ReadScoringSchemeResponse {
  repeated ScoringScheme data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateScoringSchemeRequest {
  ScoringScheme data = 1;
}

message UpdateScoringSchemeResponse {
  repeated ScoringScheme data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteScoringSchemeRequest {
  ScoringScheme data = 1;
}

message DeleteScoringSchemeResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListScoringSchemesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListScoringSchemesResponse {
  repeated ScoringScheme data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetScoringSchemeListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetScoringSchemeListPageDataResponse {
  repeated ScoringScheme scoring_scheme_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetScoringSchemeItemPageDataRequest {
  string scoring_scheme_id = 1;
}

message GetScoringSchemeItemPageDataResponse {
  optional ScoringScheme scoring_scheme = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
