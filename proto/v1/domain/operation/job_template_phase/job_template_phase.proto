syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/job_template_phase";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/job_template/job_template.proto";
import "options/db.proto";

message JobTemplatePhase {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "job_template_id,code";

  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string job_template_id = 7 [(options.v1.db).references = "job_template", (options.v1.db).index = true];
  optional JobTemplate job_template = 8;
  string name = 9;
  int32 phase_order = 10;
  optional string resource_id = 11 [(options.v1.db).references = "resource", (options.v1.db).index = true];
  optional int32 setup_minutes = 12;
  optional double run_minutes_per_unit = 13;
  optional int32 teardown_minutes = 14;
  optional string predecessor_template_phase_id = 15 [(options.v1.db).references = "job_template_phase"];

  // Milestone billing weight fields. Active only when parent JobTemplate's
  // pricing flows through a PricePlan with billing_kind = MILESTONE.
  // Presence rules:
  //   triggers_billing=false   → internal phase, no event materializes
  //   triggers_billing=true + billing_percent_bps set, billing_amount null → percent of parent PricePlan total
  //   triggers_billing=true + billing_amount set, billing_percent_bps null → fixed centavos
  //   triggers_billing=true + both null → derive from sum of ProductPricePlan rows tagged with this phase
  //   triggers_billing=true + both set → reject (ambiguous)
  optional bool   triggers_billing    = 16;
  optional int32  billing_percent_bps = 17;  // 10000 = 100% of PricePlan total
  optional int64  billing_amount      = 18;  // centavos; fixed override (mutually exclusive w/ percent)
  optional string billing_currency    = 19;  // ISO 4217; only meaningful when fixed billing_amount used
  optional string scoring_scheme_id = 20 [(options.v1.db).references = "scoring_scheme"];

  // Per-phase output deliverable variant. Mirrors JobTemplate.output_product_variant_id
  // (f30) one level down: a phase yields/delivers a specific product_variant of the
  // template's umbrella output_product. NULL = the phase inherits the template-level
  // output (today's behavior — clean additive). Generic across verticals
  // (manufacturing per-operation intermediate output, professional-services milestone
  // deliverable, education rotation strand). The deliverable-match resolver joins the
  // seat's product_plan.product_id to the template-level output_product_id at umbrella
  // grain, so this field is NOT part of that match; it carries the sub-deliverable
  // identity used for display (e.g. the outcome-matrix phase-header parenthetical).
  optional string output_product_variant_id = 21 [(options.v1.db).references = "product_variant", (options.v1.db).index = true];

  reserved 22 to 29;

  // Stable machine key for this phase within its template — the path pivot for
  // document-template placeholders (parity with JobCategory.code). Unique per
  // parent job_template (message-level unique_together). Path-normalized:
  // lower(btrim(code)) matching ^[a-z][a-z0-9_]*$; NULL where unanchored.
  optional string code = 30 [(options.v1.db).index = true,
    (options.v1.db).check = "code IS NULL OR (code = lower(btrim(code)) AND code ~ '^[a-z][a-z0-9_]*$')"];

  // Immutable tenant anchor inherited from the owning JobTemplate.
  optional string workspace_id = 31 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
}

service JobTemplatePhaseDomainService {
  rpc CreateJobTemplatePhase(CreateJobTemplatePhaseRequest) returns (CreateJobTemplatePhaseResponse);
  rpc ReadJobTemplatePhase(ReadJobTemplatePhaseRequest) returns (ReadJobTemplatePhaseResponse);
  rpc UpdateJobTemplatePhase(UpdateJobTemplatePhaseRequest) returns (UpdateJobTemplatePhaseResponse);
  rpc DeleteJobTemplatePhase(DeleteJobTemplatePhaseRequest) returns (DeleteJobTemplatePhaseResponse);
  rpc ListJobTemplatePhases(ListJobTemplatePhasesRequest) returns (ListJobTemplatePhasesResponse);
  rpc GetJobTemplatePhaseListPageData(GetJobTemplatePhaseListPageDataRequest) returns (GetJobTemplatePhaseListPageDataResponse);
  rpc GetJobTemplatePhaseItemPageData(GetJobTemplatePhaseItemPageDataRequest) returns (GetJobTemplatePhaseItemPageDataResponse);

  // Extra: filter by job template
  rpc ListByJobTemplate(ListByJobTemplateRequest) returns (ListByJobTemplateResponse);
}

message CreateJobTemplatePhaseRequest {
  JobTemplatePhase data = 1;
}

message CreateJobTemplatePhaseResponse {
  repeated JobTemplatePhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadJobTemplatePhaseRequest {
  JobTemplatePhase data = 1;
}

message ReadJobTemplatePhaseResponse {
  repeated JobTemplatePhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateJobTemplatePhaseRequest {
  JobTemplatePhase data = 1;
}

message UpdateJobTemplatePhaseResponse {
  repeated JobTemplatePhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteJobTemplatePhaseRequest {
  JobTemplatePhase data = 1;
}

message DeleteJobTemplatePhaseResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListJobTemplatePhasesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListJobTemplatePhasesResponse {
  repeated JobTemplatePhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetJobTemplatePhaseListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetJobTemplatePhaseListPageDataResponse {
  repeated JobTemplatePhase job_template_phase_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetJobTemplatePhaseItemPageDataRequest {
  string job_template_phase_id = 1;
}

message GetJobTemplatePhaseItemPageDataResponse {
  optional JobTemplatePhase job_template_phase = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// Extra RPC messages
message ListByJobTemplateRequest {
  string job_template_id = 1;
}

message ListByJobTemplateResponse {
  repeated JobTemplatePhase job_template_phases = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
