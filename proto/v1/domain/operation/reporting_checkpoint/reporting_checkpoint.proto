syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/reporting_checkpoint";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/enums/enums.proto";
import "options/db.proto";

message ReportingCheckpoint {
  option (options.v1.table).table = true;

  string id = 1;
  string checkpoint_group_id = 2;
  int32 version = 3;
  domain.operation.v1.VersionStatus version_status = 4;
  optional string workspace_id = 5 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  optional string period_id = 6 [(options.v1.db).index = true];
  int32 sequence_order = 7;
  string role_code = 8;
  string label = 9;
  bool is_terminal = 10 [(options.v1.db).default = "false"];
  bool active = 11 [(options.v1.db).default = "true"];
  optional int64 date_created = 12;
  optional string date_created_string = 13 [(options.v1.db).ignore = true];
  optional int64 date_modified = 14;
  optional string date_modified_string = 15 [(options.v1.db).ignore = true];
}

service ReportingCheckpointDomainService {
  rpc CreateReportingCheckpoint(CreateReportingCheckpointRequest) returns (CreateReportingCheckpointResponse);
  rpc ReadReportingCheckpoint(ReadReportingCheckpointRequest) returns (ReadReportingCheckpointResponse);
  rpc UpdateReportingCheckpoint(UpdateReportingCheckpointRequest) returns (UpdateReportingCheckpointResponse);
  rpc DeleteReportingCheckpoint(DeleteReportingCheckpointRequest) returns (DeleteReportingCheckpointResponse);
  rpc ListReportingCheckpoints(ListReportingCheckpointsRequest) returns (ListReportingCheckpointsResponse);
  rpc GetReportingCheckpointListPageData(GetReportingCheckpointListPageDataRequest) returns (GetReportingCheckpointListPageDataResponse);
  rpc GetReportingCheckpointItemPageData(GetReportingCheckpointItemPageDataRequest) returns (GetReportingCheckpointItemPageDataResponse);
}

message CreateReportingCheckpointRequest {
  ReportingCheckpoint data = 1;
}

message CreateReportingCheckpointResponse {
  repeated ReportingCheckpoint data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadReportingCheckpointRequest {
  ReportingCheckpoint data = 1;
}

message ReadReportingCheckpointResponse {
  repeated ReportingCheckpoint data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateReportingCheckpointRequest {
  ReportingCheckpoint data = 1;
}

message UpdateReportingCheckpointResponse {
  repeated ReportingCheckpoint data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteReportingCheckpointRequest {
  ReportingCheckpoint data = 1;
}

message DeleteReportingCheckpointResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListReportingCheckpointsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListReportingCheckpointsResponse {
  repeated ReportingCheckpoint data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetReportingCheckpointListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetReportingCheckpointListPageDataResponse {
  repeated ReportingCheckpoint reporting_checkpoint_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetReportingCheckpointItemPageDataRequest {
  string reporting_checkpoint_id = 1;
}

message GetReportingCheckpointItemPageDataResponse {
  optional ReportingCheckpoint reporting_checkpoint = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
