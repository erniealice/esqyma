syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/pkg/schema/v1/domain/operation/template_task_criteria_rating_description";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/score_scale_band/score_scale_band.proto";
import "domain/operation/template_task_criteria/template_task_criteria.proto";
import "options/db.proto";

// TemplateTaskCriteriaRatingDescription binds reusable scale bands to one
// template-task criterion with wording appropriate to that job template,
// phase, and task. It is configuration/presentation data; runtime outcomes
// continue to persist only their typed numeric value.
message TemplateTaskCriteriaRatingDescription {
  option (options.v1.table).table = true;

  string id = 1;
  string template_task_criteria_id = 2 [(options.v1.db).references = "template_task_criteria", (options.v1.db).index = true];
  optional TemplateTaskCriteria template_task_criteria = 3;
  string score_scale_band_id = 4 [(options.v1.db).references = "score_scale_band", (options.v1.db).index = true];
  optional ScoreScaleBand score_scale_band = 5;
  string description = 6;
  int32 sequence_order = 7;
  bool active = 8 [(options.v1.db).default = "true"];
  optional string workspace_id = 9 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  optional int64 date_created = 10;
  optional string date_created_string = 11 [(options.v1.db).ignore = true];
  optional int64 date_modified = 12;
  optional string date_modified_string = 13 [(options.v1.db).ignore = true];
}

service TemplateTaskCriteriaRatingDescriptionDomainService {
  rpc CreateTemplateTaskCriteriaRatingDescription(CreateTemplateTaskCriteriaRatingDescriptionRequest) returns (CreateTemplateTaskCriteriaRatingDescriptionResponse);
  rpc ReadTemplateTaskCriteriaRatingDescription(ReadTemplateTaskCriteriaRatingDescriptionRequest) returns (ReadTemplateTaskCriteriaRatingDescriptionResponse);
  rpc UpdateTemplateTaskCriteriaRatingDescription(UpdateTemplateTaskCriteriaRatingDescriptionRequest) returns (UpdateTemplateTaskCriteriaRatingDescriptionResponse);
  rpc DeleteTemplateTaskCriteriaRatingDescription(DeleteTemplateTaskCriteriaRatingDescriptionRequest) returns (DeleteTemplateTaskCriteriaRatingDescriptionResponse);
  rpc ListTemplateTaskCriteriaRatingDescriptions(ListTemplateTaskCriteriaRatingDescriptionsRequest) returns (ListTemplateTaskCriteriaRatingDescriptionsResponse);
  rpc GetTemplateTaskCriteriaRatingDescriptionListPageData(GetTemplateTaskCriteriaRatingDescriptionListPageDataRequest) returns (GetTemplateTaskCriteriaRatingDescriptionListPageDataResponse);
  rpc GetTemplateTaskCriteriaRatingDescriptionItemPageData(GetTemplateTaskCriteriaRatingDescriptionItemPageDataRequest) returns (GetTemplateTaskCriteriaRatingDescriptionItemPageDataResponse);

  rpc ListByTemplateTaskCriteria(ListTemplateTaskCriteriaRatingDescriptionsByTemplateTaskCriteriaRequest) returns (ListTemplateTaskCriteriaRatingDescriptionsByTemplateTaskCriteriaResponse);
}

message CreateTemplateTaskCriteriaRatingDescriptionRequest {
  TemplateTaskCriteriaRatingDescription data = 1;
}

message CreateTemplateTaskCriteriaRatingDescriptionResponse {
  repeated TemplateTaskCriteriaRatingDescription data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadTemplateTaskCriteriaRatingDescriptionRequest {
  TemplateTaskCriteriaRatingDescription data = 1;
}

message ReadTemplateTaskCriteriaRatingDescriptionResponse {
  repeated TemplateTaskCriteriaRatingDescription data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateTemplateTaskCriteriaRatingDescriptionRequest {
  TemplateTaskCriteriaRatingDescription data = 1;
}

message UpdateTemplateTaskCriteriaRatingDescriptionResponse {
  repeated TemplateTaskCriteriaRatingDescription data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteTemplateTaskCriteriaRatingDescriptionRequest {
  TemplateTaskCriteriaRatingDescription data = 1;
}

message DeleteTemplateTaskCriteriaRatingDescriptionResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListTemplateTaskCriteriaRatingDescriptionsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListTemplateTaskCriteriaRatingDescriptionsResponse {
  repeated TemplateTaskCriteriaRatingDescription data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetTemplateTaskCriteriaRatingDescriptionListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetTemplateTaskCriteriaRatingDescriptionListPageDataResponse {
  repeated TemplateTaskCriteriaRatingDescription template_task_criteria_rating_description_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetTemplateTaskCriteriaRatingDescriptionItemPageDataRequest {
  string template_task_criteria_rating_description_id = 1;
}

message GetTemplateTaskCriteriaRatingDescriptionItemPageDataResponse {
  optional TemplateTaskCriteriaRatingDescription template_task_criteria_rating_description = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ListTemplateTaskCriteriaRatingDescriptionsByTemplateTaskCriteriaRequest {
  string template_task_criteria_id = 1;
}

message ListTemplateTaskCriteriaRatingDescriptionsByTemplateTaskCriteriaResponse {
  repeated TemplateTaskCriteriaRatingDescription template_task_criteria_rating_descriptions = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
