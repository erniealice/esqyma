syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/job_phase";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/operation/job/job.proto";
import "options/db.proto";

// --- Enum ---

enum PhaseStatus {
  PHASE_STATUS_UNSPECIFIED = 0;
  PHASE_STATUS_PENDING = 1;
  PHASE_STATUS_ACTIVE = 2;
  PHASE_STATUS_COMPLETED = 3;
}

// PhaseApprovalStatus is the LOCAL per-phase approval ladder (plan
// 20260718-phase-approval-workflow). It is orthogonal to PhaseStatus (field 11):
// approval transitions never mutate PhaseStatus, trigger completion hooks, or
// touch billing. The ladder is
//   IN_PROGRESS --submit--> FOR_REVIEW --verify--> VERIFIED --publish--> PUBLISHED
// with `return` normalizing any advanced/mixed sheet back to IN_PROGRESS.
// UNSPECIFIED is never persisted; the DB stores the enum NAME (TEXT) with a
// default of IN_PROGRESS and a CHECK over the four non-UNSPECIFIED tokens.
enum PhaseApprovalStatus {
  PHASE_APPROVAL_STATUS_UNSPECIFIED = 0;
  PHASE_APPROVAL_STATUS_IN_PROGRESS = 1;
  PHASE_APPROVAL_STATUS_FOR_REVIEW = 2;
  PHASE_APPROVAL_STATUS_VERIFIED = 3;
  PHASE_APPROVAL_STATUS_PUBLISHED = 4;
}

// --- Message ---

message JobPhase {
  option (options.v1.table).table = true;

  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6;
  string job_id = 7 [(options.v1.db).references = "job", (options.v1.db).index = true];
  optional Job job = 8;
  string name = 9;
  int32 phase_order = 10;
  PhaseStatus status = 11;
  optional string template_phase_id = 12 [(options.v1.db).references = "job_template_phase", (options.v1.db).index = true];
  optional string resource_id = 13 [(options.v1.db).references = "resource", (options.v1.db).index = true];
  optional int64 planned_start = 14;
  optional string planned_start_string = 15 [(options.v1.db).ignore = true];
  optional int64 planned_end = 16;
  optional string planned_end_string = 17 [(options.v1.db).ignore = true];
  optional int64 actual_start = 18;
  optional string actual_start_string = 19 [(options.v1.db).ignore = true];
  optional int64 actual_end = 20;
  optional string actual_end_string = 21 [(options.v1.db).ignore = true];
  optional int32 setup_minutes = 22;
  optional double run_minutes_per_unit = 23;
  optional string predecessor_phase_id = 24 [(options.v1.db).references = "job_phase"];
  optional string scoring_scheme_id = 25 [(options.v1.db).references = "scoring_scheme"];
  bool is_synthesized = 26 [(options.v1.db).default = "false"];

  reserved 27 to 39;

  // --- Approval workflow (per-phase approval ladder) ---
  // Server-owned lifecycle. Generic create forces IN_PROGRESS/null audit and
  // generic update strips these fields (P2); dedicated transition RPCs own the
  // stamps. approval_status persists as the enum NAME (TEXT NOT NULL) with the
  // raw-SQL quoted default below and a DB CHECK over the four persisted tokens.
  // Each actor/time pair is null-or-nonnull together (DB CHECK, migration). The
  // *_string fields are display-only mirrors (db.ignore) of their epoch-ms int64
  // siblings and are never persisted.
  PhaseApprovalStatus approval_status = 40 [(options.v1.db).default = "'PHASE_APPROVAL_STATUS_IN_PROGRESS'"];
  optional string submitted_by = 41;
  optional int64 submitted_at = 42;
  optional string submitted_at_string = 43 [(options.v1.db).ignore = true];
  optional string verified_by = 44;
  optional int64 verified_at = 45;
  optional string verified_at_string = 46 [(options.v1.db).ignore = true];
  optional string published_by = 47;
  optional int64 published_at = 48;
  optional string published_at_string = 49 [(options.v1.db).ignore = true];
  optional string return_reason = 50;
  optional string returned_by = 51;
  optional int64 returned_at = 52;
  optional string returned_at_string = 53 [(options.v1.db).ignore = true];

  reserved 54 to 69;
}

// --- Service ---

service JobPhaseDomainService {
  rpc CreateJobPhase(CreateJobPhaseRequest) returns (CreateJobPhaseResponse);
  rpc ReadJobPhase(ReadJobPhaseRequest) returns (ReadJobPhaseResponse);
  rpc UpdateJobPhase(UpdateJobPhaseRequest) returns (UpdateJobPhaseResponse);
  rpc DeleteJobPhase(DeleteJobPhaseRequest) returns (DeleteJobPhaseResponse);
  rpc ListJobPhases(ListJobPhasesRequest) returns (ListJobPhasesResponse);
  rpc GetJobPhaseListPageData(GetJobPhaseListPageDataRequest) returns (GetJobPhaseListPageDataResponse);
  rpc GetJobPhaseItemPageData(GetJobPhaseItemPageDataRequest) returns (GetJobPhaseItemPageDataResponse);

  // Extra: filter by job
  rpc ListByJob(ListJobPhasesByJobRequest) returns (ListJobPhasesByJobResponse);

  // --- Approval transitions (per-phase approval ladder) ---
  // Sheet-grain bulk transitions over one (job_template_id, job_template_phase_id).
  // Requests carry ONLY the sheet identity; actor + workspace resolve from trusted
  // context and are never request-supplied. Responses report the resulting target
  // status and the exact affected phase count. Use cases land in P2.
  rpc SubmitJobPhaseApproval(SubmitJobPhaseApprovalRequest) returns (SubmitJobPhaseApprovalResponse);
  rpc VerifyJobPhaseApproval(VerifyJobPhaseApprovalRequest) returns (VerifyJobPhaseApprovalResponse);
  rpc PublishJobPhaseApproval(PublishJobPhaseApprovalRequest) returns (PublishJobPhaseApprovalResponse);
  rpc ReturnJobPhaseApproval(ReturnJobPhaseApprovalRequest) returns (ReturnJobPhaseApprovalResponse);
}

// --- Standard CRUD messages ---

message CreateJobPhaseRequest {
  JobPhase data = 1;
}

message CreateJobPhaseResponse {
  repeated JobPhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadJobPhaseRequest {
  JobPhase data = 1;
}

message ReadJobPhaseResponse {
  repeated JobPhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateJobPhaseRequest {
  JobPhase data = 1;
}

message UpdateJobPhaseResponse {
  repeated JobPhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteJobPhaseRequest {
  JobPhase data = 1;
}

message DeleteJobPhaseResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListJobPhasesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListJobPhasesResponse {
  repeated JobPhase data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// --- PageData messages ---

message GetJobPhaseListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetJobPhaseListPageDataResponse {
  repeated JobPhase job_phase_list = 1;
  optional domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetJobPhaseItemPageDataRequest {
  string job_phase_id = 1;
}

message GetJobPhaseItemPageDataResponse {
  optional JobPhase job_phase = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// --- Extra RPC messages ---

message ListJobPhasesByJobRequest {
  string job_id = 1;
}

message ListJobPhasesByJobResponse {
  repeated JobPhase job_phases = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// --- Approval transition messages ---
// Requests carry ONLY the sheet identity (job_template_id, job_template_phase_id);
// the acting user and workspace resolve from trusted context, never from the
// request. `return` additionally carries an optional reason (required for a
// published return, enforced in the P2 use case). Responses report the resulting
// target approval status and the exact count of phase rows flipped.

message SubmitJobPhaseApprovalRequest {
  string job_template_id = 1;
  string job_template_phase_id = 2;

  // Narrow the transition to ONE delivery group. ABSENT = every group under the
  // template — the pre-20260725 behaviour, preserved exactly, so every existing
  // caller is unaffected and the change is wire-compatible.
  //
  // Mirrors GetOutcomeMatrixRequest.subscription_group_id: that field decides
  // which students a sheet DISPLAYS, this one decides which it UPDATES. Without
  // it the two disagree — a page showing one group's 29 students transitions all
  // 87 across the template's three groups.
  //
  // No schema change: approval_status lives on job_phase, one row per student
  // job, so the storage grain was always finer than this RPC's.
  optional string subscription_group_id = 3;
}

message SubmitJobPhaseApprovalResponse {
  PhaseApprovalStatus status = 1;
  int32 affected_count = 2;
  bool success = 3;
  optional domain.common.v1.Error error = 4;
}

