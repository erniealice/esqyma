syntax = "proto3";

package domain.operation.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/operation/job_category";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// JobCategory is a per-workspace, generic taxonomy node for job_templates
// (and, denormalized, jobs). It is single-valued (a template is in exactly
// one category) — the reference-entity shape (mirrors PlanGroup / Line), NOT
// the N:M event_tag shape. Vertical vocabulary is lyngua-only; education seeds
// the codes academic / subject_deportment / homeroom_deportment.
message JobCategory {
  option (options.v1.table).table = true;

  string id = 1;
  string name = 2;
  optional int64 date_created = 3;
  optional string date_created_string = 4 [(options.v1.db).ignore = true];
  optional int64 date_modified = 5;
  optional string date_modified_string = 6 [(options.v1.db).ignore = true];
  bool active = 7 [(options.v1.db).default = "true"];
  optional string workspace_id = 8 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  optional string code = 9 [(options.v1.db).index = true];      // stable machine key (academic, …); the label pivot
  optional int32 sort_order = 10;                                // tab / list order (NULLS LAST) — mirrors price_schedule.sort_order
  optional string status = 11;                                   // free-text lifecycle (parity w/ operator status-select); NOT an enum
}

service JobCategoryDomainService {
  rpc CreateJobCategory(CreateJobCategoryRequest) returns (CreateJobCategoryResponse);
  rpc ReadJobCategory(ReadJobCategoryRequest) returns (ReadJobCategoryResponse);
  rpc UpdateJobCategory(UpdateJobCategoryRequest) returns (UpdateJobCategoryResponse);
  rpc DeleteJobCategory(DeleteJobCategoryRequest) returns (DeleteJobCategoryResponse);
  rpc ListJobCategories(ListJobCategoriesRequest) returns (ListJobCategoriesResponse);
  rpc GetJobCategoryListPageData(GetJobCategoryListPageDataRequest) returns (GetJobCategoryListPageDataResponse);
  rpc GetJobCategoryItemPageData(GetJobCategoryItemPageDataRequest) returns (GetJobCategoryItemPageDataResponse);
}

message CreateJobCategoryRequest {
  JobCategory data = 1;
}

message CreateJobCategoryResponse {
  repeated JobCategory data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadJobCategoryRequest {
  JobCategory data = 1;
}

message ReadJobCategoryResponse {
  repeated JobCategory data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateJobCategoryRequest {
  JobCategory data = 1;
}

message UpdateJobCategoryResponse {
  repeated JobCategory data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteJobCategoryRequest {
  JobCategory data = 1;
}

message DeleteJobCategoryResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListJobCategoriesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListJobCategoriesResponse {
  repeated JobCategory data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetJobCategoryListPageDataRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message GetJobCategoryListPageDataResponse {
  repeated JobCategory job_category_list = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
  optional domain.common.v1.PaginationResponse pagination = 4;
  repeated domain.common.v1.SearchResult search_results = 5;
}

message GetJobCategoryItemPageDataRequest {
  string job_category_id = 1;
}

message GetJobCategoryItemPageDataResponse {
  JobCategory job_category = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
