syntax = "proto3";

package domain.product.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/product/line_workspace_user";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// LineWorkspaceUser pins an operator (workspace_user) at a line node for
// tier-2 group visibility. Shape mirrors client_workspace_user (workspace_id +
// is_owner); the parent FK is line_id instead of client_id, plus a generic
// servicing-capacity axis (see the capacity field). Vertical titles render from
// lyngua, never stored here.
message LineWorkspaceUser {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "line_id,workspace_user_id";
  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string workspace_id = 7 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string line_id = 8 [(options.v1.db).references = "line", (options.v1.db).index = true];
  string workspace_user_id = 9 [(options.v1.db).references = "workspace_user", (options.v1.db).index = true];
  reserved 10, 11;                 // former scope(10), role(11) — removed 2026-07 (servicing-grant refactor)
  reserved "scope", "role";        // NAMES reserved: the storage bridge is name-based protojson; a future
                                   // field reusing these names would silently absorb stale column values.
  bool is_owner = 12 [(options.v1.db).default = "false"];   // unchanged — do NOT renumber
  // Generic servicing-capacity axis (replaces the removed discriminator's info content). NOT a vertical title.
  //   'primary' = servicer / lead-eligible;  'access' = view-only member.
  // Vertical titles render from lyngua on (node type, capacity, is_owner).
  string capacity = 13 [(options.v1.db).default = "access", (options.v1.db).check = "capacity IN ('primary','access')"];
}

service LineWorkspaceUserDomainService {
  rpc CreateLineWorkspaceUser(CreateLineWorkspaceUserRequest) returns (CreateLineWorkspaceUserResponse);
  rpc ReadLineWorkspaceUser(ReadLineWorkspaceUserRequest) returns (ReadLineWorkspaceUserResponse);
  rpc UpdateLineWorkspaceUser(UpdateLineWorkspaceUserRequest) returns (UpdateLineWorkspaceUserResponse);
  rpc DeleteLineWorkspaceUser(DeleteLineWorkspaceUserRequest) returns (DeleteLineWorkspaceUserResponse);
  rpc ListLineWorkspaceUsers(ListLineWorkspaceUsersRequest) returns (ListLineWorkspaceUsersResponse);

  // Enhanced list with pagination, filtering, sorting, search
  rpc GetLineWorkspaceUserListPageData(GetLineWorkspaceUserListPageDataRequest)
    returns (GetLineWorkspaceUserListPageDataResponse);

  // Enhanced item view with related data
  rpc GetLineWorkspaceUserItemPageData(GetLineWorkspaceUserItemPageDataRequest)
    returns (GetLineWorkspaceUserItemPageDataResponse);
}

message CreateLineWorkspaceUserRequest {
  LineWorkspaceUser data = 1;
}

message CreateLineWorkspaceUserResponse {
  repeated LineWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadLineWorkspaceUserRequest {
  LineWorkspaceUser data = 1;
}

message ReadLineWorkspaceUserResponse {
  repeated LineWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateLineWorkspaceUserRequest {
  LineWorkspaceUser data = 1;
}

message UpdateLineWorkspaceUserResponse {
  repeated LineWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteLineWorkspaceUserRequest {
  LineWorkspaceUser data = 1;
}

message DeleteLineWorkspaceUserResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListLineWorkspaceUsersRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListLineWorkspaceUsersResponse {
  repeated LineWorkspaceUser data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetLineWorkspaceUserListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetLineWorkspaceUserListPageDataResponse {
  repeated LineWorkspaceUser line_workspace_user_list = 1;
  domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetLineWorkspaceUserItemPageDataRequest {
  string line_workspace_user_id = 1;
}

message GetLineWorkspaceUserItemPageDataResponse {
  LineWorkspaceUser line_workspace_user = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
