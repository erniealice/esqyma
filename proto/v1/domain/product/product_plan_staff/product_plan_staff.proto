syntax = "proto3";

package domain.product.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/product/product_plan_staff";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";
import "options/db.proto";

// ProductPlanStaff is the ELIGIBILITY edge — the qualified-staff pool for a
// subject-in-program (product_plan). role discriminates the pool membership
// ("eligible" / "primary" / "assistant"; data-driven, not an enum). It
// constrains the deliverer picker; it is NOT a subject manager / access grant
// (that would be product_plan_workspace_user). The catalog is year-neutral —
// the year lives in the engagement layer, so this row carries no period anchor.
message ProductPlanStaff {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "product_plan_id,staff_id";
  string id = 1;
  optional int64 date_created = 2;
  optional string date_created_string = 3 [(options.v1.db).ignore = true];
  optional int64 date_modified = 4;
  optional string date_modified_string = 5 [(options.v1.db).ignore = true];
  bool active = 6 [(options.v1.db).default = "true"];
  string workspace_id = 7 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
  string product_plan_id = 8 [(options.v1.db).references = "product_plan", (options.v1.db).index = true];
  string staff_id = 9 [(options.v1.db).references = "staff", (options.v1.db).index = true];
  string role = 10;
}

service ProductPlanStaffDomainService {
  rpc CreateProductPlanStaff(CreateProductPlanStaffRequest) returns (CreateProductPlanStaffResponse);
  rpc ReadProductPlanStaff(ReadProductPlanStaffRequest) returns (ReadProductPlanStaffResponse);
  rpc UpdateProductPlanStaff(UpdateProductPlanStaffRequest) returns (UpdateProductPlanStaffResponse);
  rpc DeleteProductPlanStaff(DeleteProductPlanStaffRequest) returns (DeleteProductPlanStaffResponse);
  rpc ListProductPlanStaffs(ListProductPlanStaffsRequest) returns (ListProductPlanStaffsResponse);

  rpc GetProductPlanStaffListPageData(GetProductPlanStaffListPageDataRequest)
    returns (GetProductPlanStaffListPageDataResponse);
  rpc GetProductPlanStaffItemPageData(GetProductPlanStaffItemPageDataRequest)
    returns (GetProductPlanStaffItemPageDataResponse);
}

message CreateProductPlanStaffRequest {
  ProductPlanStaff data = 1;
}

message CreateProductPlanStaffResponse {
  repeated ProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadProductPlanStaffRequest {
  ProductPlanStaff data = 1;
}

message ReadProductPlanStaffResponse {
  repeated ProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateProductPlanStaffRequest {
  ProductPlanStaff data = 1;
}

message UpdateProductPlanStaffResponse {
  repeated ProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteProductPlanStaffRequest {
  ProductPlanStaff data = 1;
}

message DeleteProductPlanStaffResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListProductPlanStaffsRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListProductPlanStaffsResponse {
  repeated ProductPlanStaff data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetProductPlanStaffListPageDataRequest {
  optional domain.common.v1.PaginationRequest pagination = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.SearchRequest search = 4;
}

message GetProductPlanStaffListPageDataResponse {
  repeated ProductPlanStaff product_plan_staff_list = 1;
  domain.common.v1.PaginationResponse pagination = 2;
  repeated domain.common.v1.SearchResult search_results = 3;
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

message GetProductPlanStaffItemPageDataRequest {
  string product_plan_staff_id = 1;
}

message GetProductPlanStaffItemPageDataResponse {
  ProductPlanStaff product_plan_staff = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
