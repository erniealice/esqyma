syntax = "proto3";

package domain.product.v1;

option go_package = "github.com/erniealice/esqyma/golang/v1/domain/product/line_attribute";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/filter.proto";
import "domain/common/sort.proto";
import "domain/common/search.proto";

import "domain/product/line/line.proto";
import "domain/common/attribute.proto";
import "options/db.proto";

message LineAttribute {
  option (options.v1.table).table = true;
  option (options.v1.table).unique_together = "line_id,attribute_id";
  string id = 1;
  string line_id = 2 [(options.v1.db).references = "line", (options.v1.db).index = true];
  string attribute_id = 3 [(options.v1.db).references = "attribute", (options.v1.db).index = true];
  string value = 4;
  Line line = 5;
  domain.common.v1.Attribute attribute = 6;
  optional int64 date_created = 7;
  optional string date_created_string = 8 [(options.v1.db).ignore = true];
  optional int64 date_modified = 9;
  optional string date_modified_string = 10 [(options.v1.db).ignore = true];
  bool active = 11 [(options.v1.db).default = "true"];
  string workspace_id = 12 [(options.v1.db).references = "workspace", (options.v1.db).index = true];
}

service LineAttributeDomainService {
  rpc CreateLineAttribute(CreateLineAttributeRequest) returns (CreateLineAttributeResponse);
  rpc ReadLineAttribute(ReadLineAttributeRequest) returns (ReadLineAttributeResponse);
  rpc UpdateLineAttribute(UpdateLineAttributeRequest) returns (UpdateLineAttributeResponse);
  rpc DeleteLineAttribute(DeleteLineAttributeRequest) returns (DeleteLineAttributeResponse);
  rpc ListLineAttributes(ListLineAttributesRequest) returns (ListLineAttributesResponse);

  // NEW: Enhanced list with pagination, filtering, sorting, search
  rpc GetLineAttributeListPageData(GetLineAttributeListPageDataRequest)
    returns (GetLineAttributeListPageDataResponse);

  // NEW: Enhanced item view with related data
  rpc GetLineAttributeItemPageData(GetLineAttributeItemPageDataRequest)
    returns (GetLineAttributeItemPageDataResponse);
}

message CreateLineAttributeRequest {
  LineAttribute data = 1;
}

message CreateLineAttributeResponse {
  repeated LineAttribute data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message ReadLineAttributeRequest {
  LineAttribute data = 1;
}

message ReadLineAttributeResponse {
  repeated LineAttribute data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message UpdateLineAttributeRequest {
  LineAttribute data = 1;
}

message UpdateLineAttributeResponse {
  repeated LineAttribute data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message DeleteLineAttributeRequest {
  LineAttribute data = 1;
}

message DeleteLineAttributeResponse {
  bool success = 1;
  optional domain.common.v1.Error error = 2;
}

message ListLineAttributesRequest {
  optional domain.common.v1.SearchRequest search = 1;
  optional domain.common.v1.FilterRequest filters = 2;
  optional domain.common.v1.SortRequest sort = 3;
  optional domain.common.v1.PaginationRequest pagination = 4;
}

message ListLineAttributesResponse {
  repeated LineAttribute data = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// NEW: Enhanced list request with core features
message GetLineAttributeListPageDataRequest {
  // Pagination settings
  domain.common.v1.PaginationRequest pagination = 1;

  // Filter conditions
  domain.common.v1.FilterRequest filters = 2;

  // Sort settings
  domain.common.v1.SortRequest sort = 3;

  // Search settings
  domain.common.v1.SearchRequest search = 4;
}

// NEW: Enhanced list response with metadata
message GetLineAttributeListPageDataResponse {
  // The line attribute data
  repeated LineAttribute line_attribute_list = 1;

  // Pagination metadata
  domain.common.v1.PaginationResponse pagination = 2;

  // Search results metadata (when search is used)
  repeated domain.common.v1.SearchResult search_results = 3;

  // Response status
  bool success = 4;
  optional domain.common.v1.Error error = 5;
}

// NEW: Simple item request
message GetLineAttributeItemPageDataRequest {
  // The line attribute ID to retrieve
  string line_attribute_id = 1;
}

// NEW: Simple item response
message GetLineAttributeItemPageDataResponse {
  // The line attribute data
  LineAttribute line_attribute = 1;

  // Response status
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}
