syntax = "proto3";

package service.operation.v1;

option go_package = "github.com/erniealice/esqyma/pkg/schema/v1/service/operation/subscription_group_outcome_export";

import "domain/common/error.proto";
import "domain/operation/job/job.proto";
import "domain/operation/job_category/job_category.proto";
import "domain/operation/job_outcome_line/job_outcome_line.proto";
import "domain/operation/job_outcome_summary/job_outcome_summary.proto";
import "domain/operation/job_phase/job_phase.proto";
import "domain/operation/job_task/job_task.proto";
import "domain/operation/job_template/job_template.proto";
import "domain/operation/job_template_task/job_template_task.proto";
import "domain/operation/job_template_phase/job_template_phase.proto";
import "domain/operation/outcome_criteria/outcome_criteria.proto";
import "domain/operation/phase_outcome_summary/phase_outcome_summary.proto";
import "domain/operation/task_outcome/task_outcome.proto";
import "domain/operation/template_task_criteria/template_task_criteria.proto";
import "domain/operation/template_task_criteria_rating_description/template_task_criteria_rating_description.proto";
import "domain/operation/subscription_group_document_template/subscription_group_document_template.proto";
import "domain/product/product_variant/product_variant.proto";

// SubscriptionGroupOutcomeExportService is the canonical, group-scoped
// composite read for category/phase options and a selected one-period outcome
// matrix. It deliberately has no workspace, principal, format, storage, or
// client-attribute selector.
service SubscriptionGroupOutcomeExportService {
  rpc GetSubscriptionGroupOutcomeExport(GetSubscriptionGroupOutcomeExportRequest)
      returns (GetSubscriptionGroupOutcomeExportResponse);
  rpc ListSubscriptionGroupOutcomeLanding(ListSubscriptionGroupOutcomeLandingRequest)
      returns (ListSubscriptionGroupOutcomeLandingResponse);
}

// ListSubscriptionGroupOutcomeLandingRequest carries only the optional schedule
// status selector. Workspace, user, workspace-user membership, principal kind,
// and scope widening are always derived from trusted request identity.
message ListSubscriptionGroupOutcomeLandingRequest {
  optional bool price_schedule_active = 1;
}

// SubscriptionGroupOutcomeLandingRow is the provider-neutral, non-PII grouped
// landing projection. Counts are derived from the scoped member/job graph; no
// client identity or outcome value crosses this boundary.
message SubscriptionGroupOutcomeLandingRow {
  string price_schedule_id = 1;
  string price_schedule_name = 2;
  bool price_schedule_active = 3;
  optional int32 price_schedule_sort_order = 4;
  string subscription_group_id = 5;
  string subscription_group_name = 6;
  bool subscription_group_active = 7;
  int64 member_count = 8;
  int64 job_template_count = 9;
}

message ListSubscriptionGroupOutcomeLandingResponse {
  repeated SubscriptionGroupOutcomeLandingRow rows = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

message GetSubscriptionGroupOutcomeExportRequest {
  string subscription_group_id = 1;

  // Optional while requesting options; required when outcome_selector is set.
  optional string job_category_id = 2;

  oneof outcome_selector {
    string job_template_phase_code = 3;
    bool final_outcome = 4;
  }
}

message SubscriptionGroupOutcomeExportContext {
  string subscription_group_id = 1;
  string subscription_group_name = 2;
  optional string price_schedule_id = 3;
  string price_schedule_name = 4;
  optional string plan_id = 5;
  string plan_name = 6;
  bool historical = 7;
}

message JobTemplatePhaseOption {
  string code = 1;
  string name = 2;
  int32 sequence_order = 3;

  // True when eligible templates disagree about the identity/ordering of this
  // code. Fayna must not offer or export an ambiguous phase.
  bool ambiguous = 4;
}

message JobCategoryOption {
  string job_category_id = 1;
  string code = 2;
  string name = 3;
  int32 sort_order = 4;
  repeated JobTemplatePhaseOption job_template_phases = 5;
  bool final_outcome_available = 6;
}

message JobTemplateColumn {
  string job_template_id = 1;
  string display_name = 2;
}

message EnrollmentEvidence {
  bool has_marks = 1;
  bool has_positive_mark = 2;
}

// OutcomeCell is lossless. Consumers apply the shared label-first/score-fallback
// and non-enrolled suppression rules; a stored numeric zero remains present.
message SubscriptionGroupOutcomeCell {
  string job_template_id = 1;
  bool job_present = 2;
  optional string scaled_label = 3;
  optional double scaled_score = 4;
  EnrollmentEvidence enrollment_evidence = 5;
  // Raw composite (pre-transmutation summary_score) of the same summary row the
  // scaled pair came from; unset when none was computed.
  optional double summary_score = 6;
}

message SubscriptionGroupOutcomeClientRow {
  string client_id = 1;
  string client_name = 2;
  string client_first_name = 3;
  string client_last_name = 4;
  repeated SubscriptionGroupOutcomeCell cells = 5;
}

message GetSubscriptionGroupOutcomeExportResponse {
  SubscriptionGroupOutcomeExportContext context = 1;

  // Always returned in options and selected-matrix modes. Each category owns
  // its own phase/final choices; no flat cross-category phase union exists.
  repeated JobCategoryOption job_categories = 2;

  // Present only for a valid selected category + outcome selector.
  repeated JobTemplateColumn job_template_columns = 3;
  repeated SubscriptionGroupOutcomeClientRow client_rows = 4;

  bool success = 5;
  optional domain.common.v1.Error error = 6;
}

// GetSubscriptionGroupClientReportCardRequest selects one member of an
// authorized subscription group. Workspace/principal scope is always derived
// from trusted request identity by the application use case and adapter.
message GetSubscriptionGroupClientReportCardRequest {
  string subscription_group_id = 1;
  string client_id = 2;

  // These codes are supplied by trusted server composition, never by an HTTP
  // selector. The adapter returns only those configured client attributes.
  repeated string client_attribute_codes = 3;

  // Plan (grade/level) attribute codes to return for the group's plan
  // (subscription_group.plan_id), e.g. a program-year label. Supplied by trusted
  // server composition, never by an HTTP selector.
  repeated string plan_attribute_codes = 4;
}

message ClientReportCardAttribute {
  string code = 1;
  string value = 2;
}

message ClientReportCardClient {
  string client_id = 1;
  string name = 2;
  string first_name = 3;
  string last_name = 4;
}

// A minimal mark row. The renderer needs the latest numeric/label/comment
// outcome and its owning task/criterion; reviewer, recorder, and attachment
// metadata do not cross this in-process read boundary.
message ClientReportCardTaskOutcome {
  string job_task_id = 1;
  string template_task_criteria_id = 2;
  optional double numeric_value = 3;
  optional string scaled_label = 4;
  optional string determination_note = 5;
  optional int64 recorded_date = 6;
}

message ClientReportCardStaff {
  string staff_id = 1;
  string display_name = 2;
}

message ClientReportCardTeacherAssignment {
  string job_id = 1;
  string job_phase_id = 2;
  string staff_id = 3;
  string display_name = 4;
}

// ClientReportCardRenderGateSheet is one complete group-scoped approval
// sheet. Template-backed sheets are keyed by job_template_phase_id. A phase
// with no template phase is evaluated as its own singleton, keyed by
// job_phase_id. Exactly one row is returned for each distinct expected key.
message ClientReportCardRenderGateSheet {
  optional string job_template_phase_id = 1;
  optional string job_phase_id = 2;
  string applied_subscription_group_id = 3;
  int32 target_count = 4;
  bool any_workflow_entered = 5;
  bool all_published = 6;
  bool has_data = 7;
}

// ClientReportCardProjection contains only the selected client's enrollment
// graph and the supporting typed records needed by the client table, the
// repeated-table phase document, and the existing Year Final builder. It is
// never a roster response.
message ClientReportCardProjection {
  SubscriptionGroupOutcomeExportContext context = 1;
  ClientReportCardClient client = 2;
  repeated ClientReportCardAttribute attributes = 3;
  repeated domain.operation.v1.Job jobs = 4;
  repeated domain.operation.v1.JobTemplate job_templates = 5;
  repeated domain.operation.v1.JobCategory job_categories = 6;
  repeated domain.operation.v1.JobPhase job_phases = 7;
  repeated domain.operation.v1.JobTemplatePhase job_template_phases = 8;
  repeated domain.operation.v1.JobTemplateTask job_template_tasks = 9;
  repeated domain.operation.v1.JobTask job_tasks = 10;
  repeated ClientReportCardTaskOutcome task_outcomes = 11;
  repeated domain.operation.v1.OutcomeCriteria outcome_criteria = 12;
  repeated domain.operation.v1.TemplateTaskCriteria template_task_criteria = 13;
  repeated domain.operation.v1.PhaseOutcomeSummary phase_outcome_summaries = 14;
  repeated domain.operation.v1.JobOutcomeSummary job_outcome_summaries = 15;
  repeated domain.operation.v1.JobOutcomeLine job_outcome_lines = 16;
  repeated ClientReportCardStaff staff = 17;
  repeated ClientReportCardTeacherAssignment teacher_assignments = 18;
  repeated string render_gate_job_ids = 19;
  repeated string client_subscription_ids = 20;
  repeated domain.operation.v1.TemplateTaskCriteriaRatingDescription rating_descriptions = 21;
  string render_gate_applied_subscription_group_id = 22;
  repeated ClientReportCardRenderGateSheet render_gate_sheets = 23;
  // Configured attributes of the group's plan (plan_attribute), same shape as
  // the client attributes above.
  repeated ClientReportCardAttribute plan_attributes = 24;
  // Product variants referenced by the template phases above
  // (job_template_phase.output_product_variant_id), id + sku only. The
  // document names a variant-pinned job "Arts (Music)" from these.
  repeated domain.product.v1.ProductVariant product_variants = 25;
}

message GetSubscriptionGroupClientReportCardResponse {
  ClientReportCardProjection report_card = 1;
  bool success = 2;
  optional domain.common.v1.Error error = 3;
}

// The following messages define an in-process report-render seam. They are not
// methods on the generated gRPC service and are never registered as transport.
// Expected group axes are optimistic coherence assertions only; the resolver
// re-derives them from the authorized group before candidate lookup.
message ResolveSubscriptionGroupOutcomeDocumentForRenderRequest {
  string subscription_group_id = 1;
  string job_category_id = 2;
  domain.operation.v1.RenderProfile render_profile = 3;
  optional string expected_plan_id = 4;
  optional string expected_price_schedule_id = 5;
}

message ResolvedSubscriptionGroupOutcomeDocument {
  string storage_container = 1;
  string storage_key = 2;
  domain.operation.v1.RenderProfile render_profile = 3;
  string job_category_id = 4;
}

message ResolveSubscriptionGroupOutcomeDocumentForRenderResponse {
  optional ResolvedSubscriptionGroupOutcomeDocument document = 1;
  bool found = 2;
  bool success = 3;
  optional domain.common.v1.Error error = 4;
}
