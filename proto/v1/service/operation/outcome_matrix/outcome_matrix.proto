syntax = "proto3";

package service.operation.v1;

option go_package = "github.com/erniealice/esqyma/pkg/schema/v1/service/operation/outcome_matrix";

import "domain/common/error.proto";
import "domain/operation/outcome_criteria/outcome_criteria.proto";
import "domain/operation/job_phase/job_phase.proto";

// ---------------------------------------------------------------------------
// Outcome matrix — an OPERATION-domain service (cross-aggregate derived read
// with no aggregate root of its own; same service-driven-domain rationale as
// service/security/permission_query.proto). Grouped under service/operation.
//
// It renders a SPREADSHEET grading grid for ONE job_template (the "subject"):
//   rows    = clients (students)                       — frozen first column
//   columns = job_template_phase → job_template_task
//             → criterion (outcome_criteria via
//               template_task_criteria)                — a 3-level sticky header
//   cells   = the client's task_outcome for that
//             (task, criterion), input-enforced by the
//             criterion's outcome_criteria             — spreadsheet-editable
//
// COLUMNS come from the TEMPLATE decomposition (shared across all students);
// CELLS resolve each student's own instance: job (client_id, job_template_id)
// → job_phase (template_phase_id) → job_task (template_task_id) → task_outcome
// (job_task_id, criteria_version_id). A principal may only edit cells it
// recorded (recorded_by == acting staff); others are read-only.
//
// This genericizes the former education-specific, app-local grade sheet
// (apps/school-admin/internal/composition/grade_sheet.go, 1,189 LOC of raw SQL).
// The shape is pure universal-job-model with ZERO education columns — "grade /
// student / subject / criterion" are lyngua label overrides only.
//
// PROTO SHAPE (Q-PROTO-SHAPE, locked 2026-07-02): domain-honest, per the
// service/dashboard idiom of embedding domain messages. The column tree carries
// THIN {id,label} phase/task envelopes and EMBEDS the full outcome_criteria
// entity at the leaf (the cell-enforcement contract lives on the entity — no
// bespoke re-field / drift). Only the derived, no-entity-equivalent projection
// (the scoped OutcomeCell) is a bespoke message, mirroring reporting's
// AgingBuckets. The 3-level header nesting is a thin presentation envelope the
// fayna view maps 1:1 onto its grid.
//
// Row visibility is FAIL-CLOSED via the principalscope primitive; SCOPE_ALL is
// permission-gated and downgrades to MINE if denied.
//
// PROTO MODE (Q-PROTO-MODE, locked 2026-07-02 → service{rpc}, FINAL): this
// proto is the SINGLE DETERMINISTIC SOURCE for both the message shapes AND the
// operation contract — the service block generates the
// OutcomeMatrixServiceServer interface, which the postgres adapter implements
// directly (exactly like task_outcome and the reporting/* services). NO
// hand-written port file: a hand-written Go port can drift from the messages;
// the generated interface cannot (the compiler forces the adapter to match).
// The gRPC server scaffolding (ServiceDesc/Register/Unimplemented) is inert —
// nothing registers it on a gRPC server — so it is dead weight, not attack
// surface. The use case depends on the GENERATED interface via the registry
// factory; the initializer wires it.
//
// Consumed by internal/application/usecases/service/operation/outcome_matrix/;
// wired in internal/composition/core/initializers/service/operation.go.
// ---------------------------------------------------------------------------

service OutcomeMatrixService {
  rpc GetOutcomeMatrix(GetOutcomeMatrixRequest) returns (GetOutcomeMatrixResponse);
  // GetOutcomeSummaryRoster is the roster-scoped composite read (20260720
  // export drawer P2): one row per student under a job_template, carrying each
  // phase's stored composite (phase_outcome_summary.scaled_label) and the
  // stored year-final (job_outcome_summary.scaled_label + is_authoritative).
  // Stored values are read VERBATIM — never recomputed (D8). Serves the CSV
  // "Final" export today and the composite PDF builder later (P5).
  rpc GetOutcomeSummaryRoster(GetOutcomeSummaryRosterRequest) returns (GetOutcomeSummaryRosterResponse);
}

// OutcomeMatrixScope selects the row set. UNSPECIFIED is fail-closed → MINE.
enum OutcomeMatrixScope {
  OUTCOME_MATRIX_SCOPE_UNSPECIFIED = 0;  // fail-closed → treated as MINE
  OUTCOME_MATRIX_SCOPE_MINE        = 1;  // only clients/outcomes the acting principal is linked to / recorded
  OUTCOME_MATRIX_SCOPE_ALL         = 2;  // all clients under the template (permission-gated; else downgraded to MINE)
}

message GetOutcomeMatrixRequest {
  string job_template_id = 1;          // REQUIRED — the page is one template (subject)
  OutcomeMatrixScope scope = 2;
  // Narrow rows to one delivery group's members. Field 3 unchanged (wire
  // compatible); RENAMED from section_id 2026-07-25 — "section" is education
  // vocabulary and belongs in lyngua, not in a generic contract. The display
  // slug stays /section/{group_id} via the education route overrides.
  optional string subscription_group_id = 3;
  optional string product_id = 4;      // output_product_id — narrow rows to a product's jobs
}

// ---- Column tree: THIN phase/task envelopes; domain entity at the leaf ------

// CriterionColumn is a LEAF column = one template_task_criteria row under a task.
// It carries the composite cell-address key + the junction's ordering/required,
// and EMBEDS the full outcome_criteria entity (the enforcement contract — type,
// min/max, increment, labels, allowed values — lives on the entity, not a copy).
message CriterionColumn {
  string column_key = 1;               // "{job_template_task_id}:{outcome_criteria_id}" — the cell address
  int32 sequence_order = 2;            // template_task_criteria.sequence_order
  bool required = 3;                   // template_task_criteria.required_override (effective)
  domain.operation.v1.OutcomeCriteria criteria = 4;
}

// TaskColumn is a thin grouping envelope for one job_template_task.
message TaskColumn {
  string job_template_task_id = 1;
  string label = 2;                    // task name (e.g. "Summative Assessment 1")
  int32 sequence_order = 3;
  repeated CriterionColumn criteria = 4;
}

// PhaseColumn is a thin grouping envelope for one job_template_phase.
message PhaseColumn {
  string job_template_phase_id = 1;
  string label = 2;                    // phase name (e.g. "Semester 1")
  int32 sequence_order = 3;
  repeated TaskColumn tasks = 4;
  // Stable machine key from job_template_phase.code (e.g. "s1"/"s2"); empty
  // when unset. Additive (Q8, 20260720 export drawer): lets the view/export key
  // the period axis on the phase CODE rather than the mutable display label —
  // the label is DB data that varies, the code is the reserved semester anchor.
  string code = 5;
}

// ---- Rows: the derived, no-entity-equivalent cell projection ---------------

// OutcomeCell is the one genuinely bespoke projection (like reporting's
// AgingBuckets): a client's resolved outcome for a (template task, criterion).
// job_task_id is the student's resolved instance ("" if the student has no
// instance yet — cell not editable); outcome_id is "" until a score is recorded.
// Value fields mirror task_outcome and are populated per the criterion's type.
message OutcomeCell {
  string outcome_id = 1;               // task_outcome.id — "" if not yet recorded
  string job_task_id = 2;              // student's job_task for the column's template task — "" if none
  optional double numeric_value = 3;
  optional string text_value = 4;
  optional string categorical_value = 5;
  optional bool pass_fail_value = 6;
  string recorded_by = 7;              // owner staff_id
  bool editable = 8;                   // acting principal may edit (recorded_by == acting staff, or own new instance)

  // Server-derived instance addressing for save-time recompute dedup (Q-GSE-5).
  // The record action recomputes each affected phase/job summary inline on save;
  // it must dedup the (job_phase, job) set from SERVER-derived data, never from
  // attacker-controlled POST keys. These two ids come straight from the same
  // resolved instance row that produced job_task_id (field 2) — "" when the
  // student has no materialised instance for the column yet (cell not editable).
  string job_phase_id = 9;             // student's job_phase for the column's template phase — "" if none
  string job_id = 10;                  // student's job for this template (subject) — "" if none

  // Grader's free-text determination narrative for this cell, mirrored verbatim
  // from task_outcome.determination_note (f14). "" when no narrative recorded.
  // Additive projection field (20260723 grade-narrative drawer): drives the grid
  // message-glyph filled/outline state and the read/write of the narrative drawer.
  // Type-agnostic (safe for every criteria_type; never conflated with the typed
  // value fields 3-6). NOTHING reads text_value (f4) for narratives post-cutover.
  optional string determination_note = 11;
}

message OutcomeRow {
  string client_id = 1;
  string client_label = 2;             // display label (opaque id unless resolved)
  map<string, OutcomeCell> cells = 3;  // column_key → cell
}

// ---- Per-phase approval roll-up (plan 20260718-phase-approval-workflow P3) --

// PhaseApprovalRollup is the truthful, per-template-phase instance roll-up the
// approval bar renders (codex-rereview.md fresh finding: "the matrix response
// already carries enough data for a truthful approval bar" — REFUTED). It is
// derived over the FULL sheet set S (every active job_phase in the workspace for
// this template + template_phase), NOT the staff-visible row subset — a teacher
// on scope=MINE still sees the whole sheet's true state, and the derived state
// cannot be fabricated from the visible cells alone.
//
// `status` is the sole approval status when every member shares one, or the
// LOWEST status on the ladder when they differ (`mixed` = true then). The four
// derived overlay states (`not_started`, `mixed/attention`, `hard_frozen`) are
// NOT enum members — they compose from these fields (not_started = status
// IN_PROGRESS && !has_data; mixed = the flag; hard_frozen = the flag).
message PhaseApprovalRollup {
  string job_template_phase_id = 1;
  // Sole status across the sheet, or the LOWEST ladder status when mixed.
  domain.operation.v1.PhaseApprovalStatus status = 2;
  bool mixed = 3;                       // the sheet's members are not all in one status
  int32 target_count = 4;              // number of active job_phase rows in the full sheet S
  bool has_data = 5;                   // any active outcome/data under the sheet
  bool hard_frozen = 6;               // closed schedule OR active authoritative final (plan §4.4)
  // Blank required matrix leaves (task × criterion) across S — surfaced in the
  // D6 submit confirmation dialog. Same task×criterion seam the submit
  // transition stamps on its audit event; computed only when the sheet is
  // IN_PROGRESS (submit-eligible), otherwise 0.
  int32 blank_required_count = 7;
}

message GetOutcomeMatrixResponse {
  string job_template_id = 1;
  string job_template_name = 2;
  repeated PhaseColumn phases = 3;       // the column tree
  repeated OutcomeRow rows = 4;          // the client rows
  bool success = 5;
  optional domain.common.v1.Error error = 6;
  // Per-template-phase approval roll-up, one entry per phase column, derived
  // over the full sheet set S (P3). Empty on mock/non-postgres builds.
  repeated PhaseApprovalRollup approval_rollups = 7;
}

// ---- Roster composite read (20260720 export drawer P2) ---------------------
//
// GetOutcomeSummaryRoster returns the stored per-period + year-final composites
// for every student under one job_template — the MMIS-parity gradesheet schema
// (student · Sem-1 final · Sem-2 final · Final). It reads STORED values
// verbatim (phase_outcome_summary.scaled_label, job_outcome_summary.scaled_label)
// and never recomputes (D8: closed AYs are frozen/authoritative). Workspace-
// scoped in the adapter SQL from the session identity; `scope` mirrors
// GetOutcomeMatrix — MINE/UNSPECIFIED narrows to the staff-reachable job set
// (fail-closed for non-staff principals), ALL requires the caller's
// workspace:list re-gate and reads the full workspace roster.

message GetOutcomeSummaryRosterRequest {
  string job_template_id = 1;          // REQUIRED — the page is one template (subject)
  OutcomeMatrixScope scope = 2;
}

// OutcomeSummaryPhaseEntry is one roster member's stored composite pair for one
// phase. Both values come from the SAME latest active phase_outcome_summary row
// and are read verbatim:
//   * summary_score  — the raw composite the scoring scheme combined (pre-transmutation)
//   * scaled_label   — the transmuted output of that composite (post-transmutation)
// One row, one upsert, so the pair can never be mutually inconsistent.
message OutcomeSummaryPhaseEntry {
  string job_template_phase_id = 1;
  string code = 2;                     // job_template_phase.code (e.g. "s1"/"s2"); "" when unset
  string label = 3;                    // phase name (e.g. "Semester 1")
  int32 sequence_order = 4;            // job_template_phase.phase_order
  string scaled_label = 5;             // stored transmuted composite; "" when none

  // Stored phase_outcome_summary.summary_score, verbatim; UNSET when the row has
  // none. Presence-tracked on purpose (docs/plan/20260729-criteria-total-rating-rules,
  // Option A / D4): a stored 0 is a real composite and must stay distinguishable
  // from "not computed" — the adapter scans sql.NullFloat64 and must never COALESCE.
  optional double summary_score = 6;
}

// OutcomeSummaryRosterRow is one student's per-period composites plus the stored
// year-final (job_outcome_summary.scaled_label + is_authoritative), all verbatim.
message OutcomeSummaryRosterRow {
  string client_id = 1;
  string client_label = 2;             // opaque id unless the view resolves a display name (matrix parity)
  repeated OutcomeSummaryPhaseEntry phases = 3;   // per-phase composites, sequence order
  string year_final_label = 4;         // job_outcome_summary.scaled_label, verbatim; "" when none
  bool year_final_is_authoritative = 5;// job_outcome_summary.is_authoritative passthrough
}

message GetOutcomeSummaryRosterResponse {
  string job_template_id = 1;
  repeated OutcomeSummaryRosterRow rows = 2;
  bool success = 3;
  optional domain.common.v1.Error error = 4;
}
