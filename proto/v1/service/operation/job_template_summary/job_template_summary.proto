syntax = "proto3";

package service.operation.v1;

option go_package = "github.com/erniealice/esqyma/pkg/schema/v1/service/operation/job_template_summary";

import "domain/common/error.proto";
import "domain/common/pagination.proto";
import "domain/common/search.proto";
import "domain/common/sort.proto";
import "domain/operation/job_phase/job_phase.proto";

// ---------------------------------------------------------------------------
// Job-template summary — an OPERATION-domain service (a cross-aggregate derived
// read with no aggregate root of its own; same service-driven-domain rationale
// as service/operation/outcome_matrix.proto and service/security/
// permission_query.proto). Grouped under service/operation.
//
// It collapses the education-tier "class list" (and, generically, any
// deliverable-template roster summary) into ONE server-side GROUP-BY read: one
// JobTemplateSummary row per job_template that has >=1 (resolver-scoped) job for
// the requested job status. Each row carries the template's identity, its
// delivery GROUP (the subscription_group its jobs' origin subscriptions belong
// to), the DELIVERER (the staff of record, resolved through the active
// subscription_seat whose product plan matches the template's output product),
// the scoped JOB COUNT, the group's PRICE SCHEDULE, and the template's OUTPUT
// PRODUCT.
//
// This is the server-side replacement for the fayna view's former ~76-fetch Go
// aggregation (page-loop jobs + seats + lookups). The registrar path collapses
// to a single call; the staff path is narrowed by principalscope inside the
// adapter (STAFF principals see only their reachable jobs — the subscription_seat
// tier widens that to the class grain; non-staff principals see all).
//
// GENERIC by construction (owner O5, 20260711): NO vertical nouns anywhere —
// no class/section/teacher/student/subject identifiers. The universal
// job/template/subscription/seat/staff vocabulary is the only vocabulary here;
// education labels ("Class"/"Section"/"Teacher"/"Students"/"Academic Year")
// enter ONLY via lyngua, never as a proto field, RPC, or message name.
//
// PROTO MODE (mirrors outcome_matrix, Q-PROTO-MODE service{rpc}): this proto is
// the SINGLE deterministic source for both the message shapes AND the operation
// contract — the service block generates the JobTemplateSummaryServiceServer
// interface, which the postgres adapter implements directly (no hand-written
// port that could drift from the messages). The gRPC scaffolding is inert
// (nothing registers it on a gRPC server); the use case depends on the
// GENERATED interface via the registry factory, and the initializer wires it.
//
// This message set is a QUERY read-model, NOT a persisted table: it carries no
// (options.v1.table).table and no (options.v1.db) annotations.
//
// Consumed by internal/application/usecases/service/operation/job_template_summary/;
// wired in internal/composition/core/initializers/service/operation.go.
// ---------------------------------------------------------------------------

service JobTemplateSummaryService {
  rpc ListJobTemplateSummaries(ListJobTemplateSummariesRequest) returns (ListJobTemplateSummariesResponse);
}

// Deliverer is one staff-of-record on a template. A template can have MORE THAN
// ONE deliverer when its jobs are delivered by several staff (e.g. a merged
// deliverable whose phases are each delivered by a different staff — each holds
// an active subscription_seat whose product_plan matches the template's umbrella
// output product). Generic: no vertical nouns (education: a Section's two
// rotation-strand Teachers).
message Deliverer {
  string staff_id = 1;
  string staff_name = 2;
}

// JobTemplateSummary is normally one aggregated delivery-summary row per
// (job_template, subscription_group) with >=1 resolver-scoped job for the
// requested status. When the sanitized request permits active-template
// fallback, a category with no aggregate rows may instead carry explicitly
// marked template-grain rows. Every id is an opaque, generic entity id; every
// *_name is a display label the adapter resolves server-side.
message JobTemplateSummary {
  string job_template_id = 1;
  string job_template_name = 2;
  string subscription_group_id = 3;    // the delivery group (education: Section)
  string subscription_group_name = 4;
  // 5,6 were singular staff_id/staff_name (one deliverer per template). A merged
  // deliverable legitimately has multiple deliverers (one per delivered phase),
  // so the shape is now the repeated `deliverers` (field 12).
  reserved 5, 6;
  reserved "staff_id", "staff_name";
  int32 job_count = 7;                 // DISTINCT resolver-scoped jobs on the template
  string price_schedule_id = 8;        // the group's price schedule
  string price_schedule_name = 9;
  string output_product_id = 10;       // the template's deliverable product
  string output_product_name = 11;
  repeated Deliverer deliverers = 12;  // all staff of record (>=1), sort-stable
  // job_category_id (field 13, R9 W-A1) — the template's CURRENT job_category FK
  // (job_template.job_category_id, proto field 32), the AUTHORITATIVE category
  // partition for the report-cards landing (plan 20260719-report-cards-landing
  // §3.0/§3.1). Nullable in the DB (a template may carry no category); the postgres
  // adapter scans it with sql.NullString → "" on NULL, and the view maps "" to the
  // single "Uncategorized" bucket. Declared as a plain string (NOT proto3 `optional`)
  // to match this message's sibling nullable fields — price_schedule_id / price_
  // schedule_name / output_product_id / output_product_name are all LEFT-join-nullable
  // and all scan sql.NullString → "" into plain strings — and the "NULL → empty
  // string" read-model contract (§3.1).
  string job_category_id = 13;
  // --- Phase-approval preaggregate (R7 P4; fields 14–17 per the LOCKED tag
  // allocation in plan 20260718-phase-approval-workflow §4.5, recorded
  // identically in 20260719-report-cards-landing §3.5; fields 18–21 per the
  // AMENDED dual-grain contract of the same two sections + Q-R9-1). Derived
  // from the SAME resolver-scoped job set as the row (codex-tandem: STAFF and
  // admin see the chip over the same job scope as the row's counts).
  //
  // A "phase" below is one SHEET (job_template_phase instance); a sheet is
  // DATA-BEARING when >=1 active task_outcome exists under an active job_task
  // of its active job_phase rows. No-data sheets are EXCLUDED from every
  // count/denominator (the D3/Q-R9-1 contract). lowest_status is the
  // conservative LOWEST approval ladder rank across the data-bearing sheets'
  // job_phase rows; mixed_attention is true when any data-bearing sheet is
  // internally mixed (its rows sit at differing statuses — the derived
  // Attention overlay). With ZERO data-bearing sheets the counts are 0 and the
  // status is PHASE_APPROVAL_STATUS_UNSPECIFIED (render the neutral
  // not-started default; UNSPECIFIED is never persisted, plan §4.1).
  //
  // TEMPLATE-WIDE grain (14–17): over ALL scoped rows of the template — the
  // /courses list row chip ("n/m published" + lowest state, D3).
  int32 published_count = 14;                                  // data-bearing sheets whose every row is PUBLISHED
  int32 phase_count = 15;                                      // data-bearing sheets (the denominator)
  domain.operation.v1.PhaseApprovalStatus lowest_status = 16;  // conservative lowest across data-bearing sheets
  bool mixed_attention = 17;                                   // any data-bearing sheet internally mixed
  // GROUP+TEMPLATE grain (18–21): the SAME quadruple restricted to THIS row's
  // (subscription_group, template) slice — the R9 Phase-B cell grain (Q-R9-1:
  // subject state = group_lowest_status; the landing derives its four-status
  // subject distribution per (group, category) cell by counting summary rows
  // per group_lowest_status). Computed EXPLICITLY alongside 14–17 so the
  // courses row keeps template-wide semantics while the landing cell reads
  // per-group state — one consumer's semantics never silently changes for the
  // other (codex-plan-review §7 wave 5).
  int32 group_published_count = 18;
  int32 group_phase_count = 19;
  domain.operation.v1.PhaseApprovalStatus group_lowest_status = 20;
  bool group_mixed_attention = 21;
  // True only for an active job_template surfaced at template grain because
  // its category has zero aggregate delivery rows in the scoped status
  // universe. Delivery/group/schedule fields and item count are intentionally
  // blank/zero on this row; consumers use this marker rather than inferring the
  // grain from a nullable related id.
  bool template_grain_fallback = 22;
}

// JobCategorySummaryCount is the number of rows in one job-category partition
// of the status-scoped summary universe before selected-category pagination and
// search. A row is at the service's declared summary grain: normally
// (job_template, subscription_group), or the active template-grain fallback for
// a category with no delivery aggregate. It is deliberately not a persisted
// JobCategory field or a unique-template count.
message JobCategorySummaryCount {
  string job_category_id = 1;
  int32 summary_count = 2;
}

message ListJobTemplateSummariesRequest {
  // status is the job status token the job.status column stores (the full
  // JobStatus enum name, e.g. "JOB_STATUS_ACTIVE"); the adapter filters jobs
  // server-side by it. Empty = no status filter.
  string status = 1;
  // subscription_group_id optionally narrows the summary to one delivery group.
  optional string subscription_group_id = 2;
  optional domain.common.v1.PaginationRequest pagination = 3;
  // price_schedule_active (Q-GSE-7, additive, school-admin only). When present
  // and true, the adapter restricts the summary to templates whose group price
  // schedule is currently active (the AY-scoping predicate). ABSENT ⇒ no
  // schedule predicate (today's behaviour — all schedules).
  optional bool price_schedule_active = 4;
  // job_category_id narrows the returned result before pagination. Category
  // badge counts in the response remain status-scoped and are not narrowed by
  // this selected-category value or by search.
  optional string job_category_id = 5;
  // Bounded free-text search over adapter-owned summary fields.
  optional domain.common.v1.SearchRequest search = 6;
  // Adapter-allowlisted ordering at the complete response-row grain.
  optional domain.common.v1.SortRequest sort = 7;
  // Caller preference for active template-grain fallback. The application use
  // case sanitizes this flag through an independent job_template:list gate;
  // the adapter never treats an unsanitized client value as authorization.
  optional bool include_template_fallback = 8;
}

message ListJobTemplateSummariesResponse {
  repeated JobTemplateSummary summaries = 1;
  bool success = 2;
  optional domain.common.v1.PaginationResponse pagination = 3;
  optional domain.common.v1.Error error = 4;
  repeated JobCategorySummaryCount job_category_counts = 5;
}
